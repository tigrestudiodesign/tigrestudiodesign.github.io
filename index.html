p11:{tag:'A new digital method of making Nike Air · announced November 16, 2026 · my last program at Nike',role:"Authored the technical manuals for two of the first Tuned Air programs and helped build their tech packs, the last work I delivered before leaving Nike in August 2026. I turned a brand-new way of making Air into documentation a factory can build from: how the unit is made, the design rules that keep it buildable, and the checks that keep it consistent.",ov:"Nike Tuned Air is a digital method of making Nike Air units, giving Nike more control over how Air looks, feels and performs. It is set to reach runners in late 2027, as the start of a broader platform across sport and Sportswear.",nw:"A proprietary digital ink and selective lamination keep the inner core from bonding to the unit, so its shape and behaviour can be tuned. With no pins or rigid zones, Air is free of its old height limits, and Nike reports Air development time down 70%, with prototypes in three days instead of three weeks."},
p01:{role:"Led upper design and technical documentation for transitioning cutting-edge knitting technologies, including Atomknit, into core inline business. Partnered hand-in-hand with manufacturing teams in Korea to bridge the gap between early-stage innovation and mass production for a smooth, high-quality transition.",ov:"The lightest and most responsive Alphafly yet, engineered from the ground up for everyone from elite marathoners chasing podium finishes to everyday runners breaking personal records.",nw:"Every major component refined for a smoother, more efficient marathon. 5% lighter than its predecessor (men's 8.5), with a 10% increase in energy return from ZoomX LT foam, updated Air Zoom units, an Atomknit upper, a carbon-fiber Flyplate and a Fast Shot outsole."},
p02:{tag:"Technical documentation · Tech manual",role:"Led upper design and technical documentation for transitioning cutting-edge technologies, including a new upper shaping material and a performance knit yarn, into Nike's core inline business. Worked hand-in-hand with manufacturing partners in Korea to bridge early-stage innovation and mass production.",ov:"A sportswear innovation merging superior comfort with four decades of Air Max heritage into an entirely new silhouette: a low-profile upper with three-layer textured printing in vivid colors inspired by the poison dart frog, and distinctive toe pads.",nw:"The launch colorway brings the inspiration to life: dramatic green hues, a chrome Swoosh, a shiny seamless finish and a tinted, translucent rubber outsole."},
p03:{role:"Led tech pack design and technical documentation for transitioning cutting-edge upper and bottom 3D-printing technologies (including Nectar and Siping) into Nike's core inline business. Worked hand-in-hand with manufacturing partners in Korea, Taiwan and Beaverton to ensure high-quality execution.",ov:"A 3D-printed silhouette unveiled at ComplexCon that pays homage to the Air Max 95: the first created using Nike's Project Nectar, and the brand's second shoe developed with Zellerfeld in a multi-year exploration of 3D-printed footwear.",nw:"A \"Big Bubble\" Max Air unit in the heel and a smaller Air unit in the forefoot deliver a consistently soft, smooth and springy feel underfoot."},
p04:{role:"Led tech pack design and technical documentation for transitioning cutting-edge bottom-making technologies, including metal printing and a sensory bottom unit, into Nike's core inline business. Worked hand-in-hand with manufacturing partners in Korea to bridge early-stage innovation and mass production.",ov:"A new type of shoe designed to help athletes lock in their mindset pre- and post-competition.",nw:"Nike's first neuroscience-based footwear, activating sensory receptors in the feet to tap the mind-body connection. The debut of the Nike Mind platform: over a decade of science, engineering and manufacturing from Nike's Mind Science Department."},
p05:{tag:"Technical documentation · Quick start guide",role:"Led upper yarn technology development and tech pack design and documentation with the traction innovation team. Transitioned making technologies including a new traction rubber and a performance knit yarn into Nike's core inline business, working hand-in-hand with manufacturing partners in Korea.",ov:"Purpose-built for long distances and demanding terrain: ACG's pinnacle expression of rugged mountain-running performance.",nw:"A complete mountain-running system: the first co-molded, dual-density supercritical foam platform for trail, a proprietary traction outsole and a trail-tuned Flyknit upper, balancing uphill efficiency, downhill protection and all-condition confidence."},
p06:{role:"Led early-stage tooling and hardware development to push performance boundaries, a strategic step in bringing powered footwear to a broad consumer base, working alongside the Amplify × Footwear Development team on upper solutions for the program.",ov:"Nike's first powered footwear system for running and walking, designed to help everyday athletes go further and faster with less effort.",nw:"Engineered to augment natural lower-leg and ankle movement, Project Amplify gives a powered assist to anyone who wants to move: a new future for walking, jogging and running."},
p07:{role:"Authored the tech manual for the sculpted Air Zoom unit and developed the tech packs for the Pegasus Premium, part of Nike's innovation super-cycle and proof of the power of its proprietary Air technology.",ov:"Nike debuts the Pegasus Premium, redefining the boundaries of cushioning to deliver comfort like never before.",nw:"A sculpted Air Zoom unit contoured to the natural profile of the foot carries runners from heel to toe, a springy, smooth sensation never felt in Air Zoom before. With ZoomX foam and a visible, integrated Air Zoom unit, it returns more energy than any other shoe in the Pegasus collection."},
p08:{role:"Authored the tech manual and developed the tech packs for the Nike Motiva, documenting its new rocker geometry and cushioning so the smooth, easy ride carried into production.",ov:"A shoe made for walking, jogging and running with comfort and ease. New rocker geometry and half-length cushioning give a smooth, stable feel across everyday activities and paces.",nw:"Shaped by Nike Run Club insights and interviews with more than 1,000 people who walk, jog and run, to understand their needs and make a shoe they love."},
p09:{role:"Authored the technical documentation and managed the electronics integration specifications for the removable magnetic pod interface. Defined integration parameters for the on-pod controls and the Bluetooth module linking to the Hyperice app, bridging soft-goods strap construction with reliable hardware connectivity.",ov:"A recovery slide that merges low-profile Nike Air Zoom cushioning with Hyperice's targeted heat and vibration technology to help athletes unwind and reduce tension from the ground up.",nw:"A removable, magnetic Hyperslide Pod in the adjustable strap delivers three levels of heat (up to 117°F / 47°C) and three levels of vibration in 15-minute recovery cycles, on a full-length Air Zoom sole, wearable with or without the pod."},
p10:{role:"Spearheaded the electronics integration documentation and technical specifications for the internal footwear circuitry: routing the power systems, insole-housed battery units and pneumatic-to-thermal hardware connections safely within the shoe's structural architecture.",ov:"A wearable recovery and warm-up tool that prepares feet and ankles for movement by combining advanced heat with dynamic air compression.",nw:"Dual-air Normatec bladders bonded to heating elements deliver warmth and rhythmic massage across the feet, Achilles and ankles, up to 125°F / 52°C and 210 mmHg, controlled on the boot or via Bluetooth in the Hyperice app."}

function hbTap(el){
 const sec=el.closest('.hb-sec'),map=sec.querySelector('.hb-map'),ifs=sec.querySelector('.hb-if');
 const was=el.classList.contains('on')&&el.getAttribute('aria-pressed')==='true';
 sec.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
 sec.querySelectorAll('[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed','false'));
 map.classList.remove('sel');ifs.classList.remove('sel');
 if(was)return;
 el.classList.add('on');el.setAttribute('aria-pressed','true');
 if(el.dataset.n){const n=el.dataset.n;
  ifs.querySelectorAll('li').forEach(li=>{if(li.dataset.s.split(' ').includes(n))li.classList.add('on')})}
 else{el.dataset.s.split(' ').forEach(n=>{const x=map.querySelector('[data-n="'+n+'"]');if(x)x.classList.add('on')})}
 map.classList.add('sel');ifs.classList.add('sel');
}

/* Nike CMF: every sampled colour plotted on the CIELAB a*b* plane and on a lightness ladder */
function cnMap(){const all=CMFN_D.flatMap((p,i)=>p.z.map(z=>({p:i+1,t:p.t,n:z[2],h:z[6],l:z[7]})));
 const W=560,C=W/2,S=C/90,x=a=>C+a*S,y=b=>C-b*S;
 const grid=[-80,-60,-40,-20,20,40,60,80].map(v=>`<line x1="${x(v)}" y1="0" x2="${x(v)}" y2="${W}"/><line x1="0" y1="${y(v)}" x2="${W}" y2="${y(v)}"/>`).join('');
 const rings=[30,60].map(r=>`<circle cx="${C}" cy="${C}" r="${r*S}" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="2 4"/><text x="${C-r*S*0.707-6}" y="${C+r*S*0.707+14}" text-anchor="end" class="cm-t">C* ${r}</text>`).join('');
 const ch=d=>Math.hypot(d.l[1],d.l[2]),neu=all.filter(d=>ch(d)<15),lab=[];
 all.filter(d=>ch(d)>=15).forEach(d=>{const px=x(d.l[1]),py=y(d.l[2]),n=lab.find(o=>Math.hypot(o.x-px,o.y-py)<16);n?n.t.push(d.p):lab.push({x:px,y:py,t:[d.p]})});
 const dots=all.map(d=>`<circle cx="${x(d.l[1]).toFixed(1)}" cy="${y(d.l[2]).toFixed(1)}" r="${ch(d)<15?6:9}" fill="${d.h}" stroke="currentColor" stroke-opacity=".55"><title>${esc(d.t+' · '+d.n+' · '+d.h+' · L*'+d.l[0]+' a*'+d.l[1]+' b*'+d.l[2])}</title></circle>`).join('')
  +lab.map(o=>`<text x="${(o.x+13).toFixed(1)}" y="${(o.y+4).toFixed(1)}" class="cm-t">${[...new Set(o.t)].sort().map(v=>String(v).padStart(2,'0')).join(' · ')}</text>`).join('')
  +`<path d="M${C+14} ${C+14} L${C+70} ${C+70} H${C+150}" fill="none" stroke="currentColor" stroke-opacity=".5"/><text x="${C+74}" y="${C+64}" class="cm-t">NEUTRALS · ${neu.length} UNDER C* 15</text>`;
 const ab=`<svg viewBox="-30 -20 ${W+60} ${W+50}" class="cm-ab" role="img" aria-label="Every sampled colour plotted on the CIELAB a* b* plane"><g stroke="currentColor" stroke-opacity=".08">${grid}</g>${rings}
  <line x1="0" y1="${C}" x2="${W}" y2="${C}" stroke="#FF5A1F"/><line x1="${C}" y1="0" x2="${C}" y2="${W}" stroke="#FF5A1F"/>
  <text x="${W-4}" y="${C-8}" text-anchor="end" class="cm-t cm-o">+a* RED</text><text x="4" y="${C-8}" class="cm-t cm-o">−a* GREEN</text><text x="${C+8}" y="10" class="cm-t cm-o">+b* YELLOW</text><text x="${C+8}" y="${W-4}" class="cm-t cm-o">−b* BLUE</text>${dots}</svg>`;
 const lad=[...all].sort((a,b)=>b.l[0]-a.l[0]).map(d=>`<li><i style="background:${d.h}"></i><span>${d.l[0].toFixed(1)}</span><b>${esc(d.n)}</b><small>${String(d.p).padStart(2,'0')}</small></li>`).join('');
 const key=CMFN_D.map((p,i)=>`<li><b>${String(i+1).padStart(2,'0')}</b> ${esc(p.t)}</li>`).join('');
 return `<section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">THE PALETTE, MAPPED</h2><p class="sh-sub">All ${all.length} colours on one colour plane: hue and chroma left, lightness right</p>
 <div class="cm-grid"><figure class="cm-f">${ab}<figcaption>CIELAB a*b* plane, D65. Distance from the centre is chroma; the dashed rings mark C* 30 and 60. Numbers match the products below.</figcaption></figure>
 <div><ol class="cm-key">${key}</ol><h3 class="cm-h">LIGHTNESS LADDER · L*</h3><ol class="cm-lad">${lad}</ol></div></div>
 <p class="fine" style="margin-top:18px">Read this way the programs split in two. Alphafly 4 and Pegasus Premium stay near the neutral centre and spend their chroma on one part: Signal Red pods, a Hyper Orange Air unit. Nike Mind and ACG Picklejus do the opposite and build the whole product from saturated warms and limes. Hyperslide never leaves the neutrals.</p></div></section>`}

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">HOW TO READ THESE NUMBERS</h2>
  <div class="cols"><div><h3>Sampled, Not Official</h3><p>Every value is measured from Nike's public product photography, so it carries the lighting and camera of that photo. A real colour standard is set on a physical sample under D65 light with a spectrophotometer. These numbers are a study of the palette, not Nike's specification.</p></div>
  <div><h3>Why CIELAB</h3><p>Hex codes are for screens. CIELAB describes colour the way factories compare it: lightness (L*), red to green (a*) and yellow to blue (b*). It is the space where colour differences (ΔE) are measured against a standard.</p></div>

/* COLOUR MATCH: CIEDE2000 across the library (checked against Sharma, Wu & Dalal 2005 test pairs) */
function de00(a,b){const [L1,a1,b1]=a,[L2,a2,b2]=b,R=Math.PI/180,C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cm=(C1+C2)/2,G=.5*(1-Math.sqrt(Cm**7/(Cm**7+25**7))),
 p1=a1*(1+G),p2=a2*(1+G),c1=Math.hypot(p1,b1),c2=Math.hypot(p2,b2),hh=(y,x)=>{const t=Math.atan2(y,x)/R;return t<0?t+360:t},h1=c1?hh(b1,p1):0,h2=c2?hh(b2,p2):0;
 const dL=L2-L1,dC=c2-c1;let dh=0;if(c1*c2){dh=h2-h1;if(dh>180)dh-=360;else if(dh<-180)dh+=360}const dH=2*Math.sqrt(c1*c2)*Math.sin(dh*R/2);
 const Lm=(L1+L2)/2,cm=(c1+c2)/2;let hm=h1+h2;if(c1*c2)hm=Math.abs(h1-h2)>180?(h1+h2<360?(h1+h2+360)/2:(h1+h2-360)/2):(h1+h2)/2;
 const T=1-.17*Math.cos((hm-30)*R)+.24*Math.cos(2*hm*R)+.32*Math.cos((3*hm+6)*R)-.2*Math.cos((4*hm-63)*R),
 SL=1+.015*(Lm-50)**2/Math.sqrt(20+(Lm-50)**2),SC=1+.045*cm,SH=1+.015*cm*T,RT=-2*Math.sqrt(cm**7/(cm**7+25**7))*Math.sin(60*Math.exp(-(((hm-275)/25)**2))*R);
 return {de:Math.sqrt((dL/SL)**2+(dC/SC)**2+(dH/SH)**2+RT*(dC/SC)*(dH/SH)),dL,dC,dH}}
const MM_TOL=[[1,'1.0','TIGHT','Parts that touch on one product, e.g. a toe cap against the upper.'],[2,'2.0','STANDARD','Same product, parts that do not touch.'],[3.5,'3.5','LOOSE','Across a collection: a bag that should read as the shoe’s family.']];
const MM_GU=10;

 const v=r=>r.d.de<=tol?(Math.abs(r.g)<=MM_GU?['ok','MATCH']:['gl','HUE OK · GLOSS OFF']):r.d.de<=2*tol?['cl','CLOSE · ADJUST']:['no','NO MATCH'],b=R[0],bv=v(b),nm=c=>String(c.i+1).padStart(2,'0')+' · '+c.n,
 vc={ok:'#3FA05A',gl:'#FFC23A',cl:'#E6E1D6',no:'#E6E1D6'}[bv[0]],sw=(c,lb)=>`<div class="mm-sw" style="--c:${c.h};--t:${mmInk(c.h)};--g:${(Math.min(c.gu,95)/100*.55).toFixed(2)}"><span>${lb}<small>${esc(nm(c))}</small><small>${c.h} · ${c.gu} GU</small></span></div>`,f=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1);

 const rng=document.getElementById('kh-t'),out=document.querySelector('.kh-o'),play=document.querySelector('.kh-play');
 const COLS=16,ROWS=7,S=1.5,MAX=80*Math.PI/180;
 // hexagon centres on the XZ plane (pointy-top offset grid), like the Hexagonal component
 const W=Math.sqrt(3)*S,cells=[];
 for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const x=c*W+(r%2?W/2:0),z=r*1.5*S;cells.push({x,z})}
 const xs=cells.map(c=>c.x),zs=cells.map(c=>c.z),cx=(Math.min(...xs)+Math.max(...xs))/2,cz=(Math.min(...zs)+Math.max(...zs))/2;
 const spanX=Math.max(...xs)-Math.min(...xs)+W,spanZ=Math.max(...zs)-Math.min(...zs)+2*S;
 const k=Math.min(760/spanX,340/spanZ),ox=400-cx*k,oz=190+cz*k,P=(x,z)=>[ox+x*k,oz-z*k];
 const corner=(c,i)=>{const a=Math.PI/180*(60*i-30);return[c.x+S*Math.cos(a),c.z+S*Math.sin(a)]};
 const NS='http://www.w3.org/2000/svg';
 svg.innerHTML=`<rect x="0" y="0" width="800" height="380" fill="#0B0B0C"/><g class="kh-g"></g><line class="kh-ray" stroke="#FFC23A" stroke-width="1.5"/><circle class="kh-sun" r="14" fill="#FFC23A"/>`;
 const g=svg.querySelector('.kh-g'),polys=[];
 cells.forEach(c=>{for(let i=0;i<6;i++){const p=document.createElementNS(NS,'polygon');p.setAttribute('stroke','#0B0B0C');p.setAttribute('stroke-width','.6');g.appendChild(p);polys.push([c,i,p])}
  const h=document.createElementNS(NS,'polygon');h.setAttribute('points',[0,1,2,3,4,5].map(i=>P(...corner(c,i)).join(',')).join(' '));h.setAttribute('fill','none');h.setAttribute('stroke','#3a3a3e');h.setAttribute('stroke-width','1.2');g.appendChild(h)});
 const stops=[[31,58,95],[38,166,154],[247,201,72],[244,123,32],[255,90,31]];
 const col=t=>{t=Math.max(0,Math.min(1,t))*(stops.length-1);const i=Math.min(stops.length-2,Math.floor(t)),f=t-i,a=stops[i],b=stops[i+1];return`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')})`};
 const draw=hour=>{
  // 4.x sun: noon direction (facade faces -Y), rotated about Z by (12-hour)*15°, height 2, distance 89.39 from the facade centre
  const ang=(12-hour)*15*Math.PI/180,D=89.39,H=2;
  let v=[0,-1,H/D];const L=Math.hypot(...v);v=v.map(q=>q/L);
  const rv=[v[0]*Math.cos(ang)-v[1]*Math.sin(ang),v[0]*Math.sin(ang)+v[1]*Math.cos(ang),v[2]];
  const sun=[cx+rv[0]*D,rv[1]*D,cz+rv[2]*D];
  // 6.x exposure: dot(facade normal -Y, unit vector hexagon -> sun)
  const ex=cells.map(c=>{const d=[sun[0]-c.x,sun[1],sun[2]-c.z],l=Math.hypot(...d);return -d[1]/l});
  const lo=Math.min(...ex),hi=Math.max(...ex);
  cells.forEach((c,i)=>{c.a=hi>lo?MAX*(hi-ex[i])/(hi-lo):0});  // 7.x remap: most sun 0°, least sun 80°
  polys.forEach(([c,i,p])=>{const A=corner(c,i),B=corner(c,(i+1)%6),m=[(A[0]+B[0])/2,(A[1]+B[1])/2],s=Math.cos(c.a);
   const tip=[m[0]+(c.x-m[0])*s,m[1]+(c.z-m[1])*s];   // flap turns about its hinge edge: the tip slides toward the edge by cos(angle)
   p.setAttribute('points',[A,B,tip].map(q=>P(...q).join(',')).join(' '));
   const shade=.82+.18*((i%3)/2);p.setAttribute('fill',col(c.a/MAX));p.style.filter=`brightness(${shade})`});
  // sun marker: projected left/right by its azimuth along the wall
  const sx=400+Math.max(-1,Math.min(1,rv[0]/Math.max(.2,-rv[1]+.2)))*360,sy=34;
  const sunEl=svg.querySelector('.kh-sun'),ray=svg.querySelector('.kh-ray'),[fx,fy]=P(cx,cz);
  sunEl.setAttribute('cx',sx);sunEl.setAttribute('cy',sy);ray.setAttribute('x1',sx);ray.setAttribute('y1',sy);ray.setAttribute('x2',fx);ray.setAttribute('y2',fy);
  const hh=Math.floor(hour),mm=Math.round((hour-hh)*60)%60;out.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
 rng.addEventListener('input',()=>{stop();draw(+rng.value)});
 let raf=0,last=0;const stop=()=>{cancelAnimationFrame(raf);raf=0;play.setAttribute('aria-pressed','false');play.textContent='▶ Play the day'};
 const step=t=>{if(!svg.isConnected)return stop();if(last){let h=+rng.value+(t-last)/1000*1.25;if(h>17)h=7;rng.value=h;draw(h)}last=t;raf=requestAnimationFrame(step)};
 play.addEventListener('click',()=>{if(raf){stop()}else{last=0;play.setAttribute('aria-pressed','true');play.textContent='❚❚ Pause';raf=requestAnimationFrame(step)}});
 draw(+rng.value);
}

function mountPN(){
 const svg=document.querySelector('.pn-svg');if(!svg||svg.dataset.on)return;svg.dataset.on=1;
 const rng=document.getElementById('pn-p'),out=document.querySelector('.pn-o'),btns=[...document.querySelectorAll('.pn-kn button')];
 const L=92,W=22,H=14,R=40,S=3.0,X0=250,Y0=110;let ki=1;
 svg.innerHTML=`<rect width="800" height="400" fill="#F6F3EC"/><g class="pn-grid"></g><circle cx="${X0}" cy="${Y0+R*S}" r="${R*S}" fill="none" stroke="#1B1B1C" stroke-width="1.2" stroke-dasharray="6 6"/><text x="${X0}" y="${Y0+R*S+6}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" fill="#6E6A64">80 mm MUG</text><rect x="${X0-56}" y="${Y0-H*S-14}" width="56" height="${H*S+20}" rx="6" fill="#B49C74"/><path class="pn-fing" fill="#C8B898" stroke="#5E6555" stroke-width="2"/><path class="pn-base" fill="none" stroke="#B65A3A" stroke-width="5" stroke-linecap="round"/><text x="126" y="44" font-family="JetBrains Mono,monospace" font-size="12" fill="#1B1B1C" font-weight="700">INDEX FINGER · SIDE VIEW</text>`;
 const g=svg.querySelector('.pn-grid');let gl='';for(let x=0;x<=800;x+=20)gl+=`<line x1="${x}" y1="0" x2="${x}" y2="400" stroke="#DCD7CC" stroke-width=".6"/>`;for(let y=0;y<=400;y+=20)gl+=`<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#DCD7CC" stroke-width=".6"/>`;g.innerHTML=gl;
 const fing=svg.querySelector('.pn-fing'),base=svg.querySelector('.pn-base');
 const eps=(p,k,em)=>{const N=p/1000*H/2;return em*(1-Math.exp(-N/(k*em)))};
 const pWrap=(k,em)=>{const e=H/R;return e>=em?Infinity:-k*em*Math.log(1-e/em)*2/H*1000};
 function draw(){
  const p=+rng.value,[name,k,em]=PN.knits[ki],e=eps(p,k,em),kap=e/H,th=L*kap;
  // centreline = woven layer (palm side, toward the mug); dorsal offset h away from the centre of curvature
  const pt=(s,v)=>{let x,y,nx,ny;if(kap<1e-6){x=s;y=0;nx=0;ny=-1}else{x=Math.sin(kap*s)/kap;y=(1-Math.cos(kap*s))/kap;nx=Math.sin(kap*s);ny=-Math.cos(kap*s)}return[X0+(x+nx*v)*S,Y0+(y+ny*v)*S]};
  const n=60,top=[],bot=[];for(let i=0;i<=n;i++){const s=L*i/n,hs=H*(1-0.1*s/L)*(s>L-9?Math.sqrt(Math.max(0,1-((s-(L-9))/9)**2)):1);top.push(pt(s,Math.max(hs,0.6)));bot.push(pt(s,0))}
  const f=a=>a.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1));
  fing.setAttribute('d','M'+f(bot).join(' L')+' L'+f(top.reverse()).join(' L')+' Z');base.setAttribute('d','M'+f(bot).join(' L'));
  const F=p/1000*W*H*H/2/L,pw=pWrap(k,em);
  out.textContent=p+' kPa';
  document.getElementById('pn-th').textContent=Math.round(th*180/Math.PI)+'°';
  document.getElementById('pn-e').textContent=Math.round(e*100)+' %';
  document.getElementById('pn-f').textContent=F.toFixed(2)+' N';
  document.getElementById('pn-s').textContent=!isFinite(pw)||pw>80?'Never wraps':p>=pw?(p>pw+12?'Over-wrapped':'Wrapped'):'Wraps at '+Math.round(pw)+' kPa';
 }
 rng.addEventListener('input',draw);
 btns.forEach(b=>b.addEventListener('click',()=>{ki=+b.dataset.k;btns.forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));
 draw();
}

function knChart(id,col){
 const C=10,R=10,u=10; let g='';
 const two=id==='slip'?['#E8DCC2','#8A5A30']:id==='chevron'?['#C9CBD2','#4A4C56']:null;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  const x=c*u,y=(R-1-r)*u; let k='K', fill=null;
  if(id==='garter'&&r%2)k='P';
  if(id==='rib1'&&c%2)k='P';
  if(id==='rib2'&&c%4>=2)k='P';
  if(id==='seed'&&(r+c)%2)k='P';
  if(id==='cable'&&(c<2||c>7))k='P';
  if(id==='lace'){if((r%6===2&&c%6===1)||(r%6===5&&c%6===4))k='O';else if((r%6===1&&c%6===1)||(r%6===4&&c%6===4))k='/'}
  if(id==='tuck'&&((r%4===1&&c%4===1)||(r%4===3&&c%4===3)))k='T';
  if(id==='slip'){const B=Math.floor(r/2)%2===1;fill=two[B?1:0];if(B&&c%4===(Math.floor(r/4)%2===0?1:3)){k='V';fill=two[0]}}
  if(id==='chevron'){const m=c%10,o=(m<=5?m:10-m);fill=two[Math.floor((r+o+30)/3)%2]}
  g+=`<rect x="${x+.5}" y="${y+.5}" width="${u-1}" height="${u-1}" fill="${fill||'#fff'}" fill-opacity="${fill?1:.06}" stroke="#fff" stroke-opacity=".22" stroke-width=".6"/>`;
  const cx=x+u/2,cy=y+u/2,ink=fill==='#E8DCC2'||fill==='#C9CBD2'?'#222':'#fff';
  if(k==='P')g+=`<circle cx="${cx}" cy="${cy}" r="1.6" fill="${ink}"/>`;
  if(k==='O')g+=`<circle cx="${cx}" cy="${cy}" r="3" fill="none" stroke="${ink}" stroke-width="1.1"/>`;
  if(k==='/')g+=`<path d="M${x+2.5} ${y+u-2.5}L${x+u-2.5} ${y+2.5}" stroke="${ink}" stroke-width="1.2"/>`;
  if(k==='T')g+=`<path d="M${x+2.5} ${y+3}Q${cx} ${y+u+2} ${x+u-2.5} ${y+3}" fill="none" stroke="${ink}" stroke-width="1.1"/>`;
  if(k==='V')g+=`<path d="M${x+2.5} ${y+2.5}L${cx} ${y+u-2.5}L${x+u-2.5} ${y+2.5}" fill="none" stroke="${ink}" stroke-width="1.1"/>`;
 }
 if(id==='cable')for(const r of [3,9]){const y=(R-1-r)*u;g+=`<rect x="20.5" y="${y+.5}" width="59" height="9" fill="#0B0C10" stroke="#fff" stroke-width=".8"/><path d="M22 ${y+8}L49 ${y+2}M51 ${y+8}L78 ${y+2}" stroke="${col}" stroke-width="2.2"/><path d="M22 ${y+2}L49 ${y+8}" stroke="#fff" stroke-width="1.1"/>`}

 <section class="band alt section"><div class="wrap"><p class="eyebrow">04 · System rules</p><h2 class="sh-title" style="font-size:32px">One System, Every Touchpoint</h2><p class="sh-sub">Six rules that keep it one company</p>

  <li><b>02</b><h3>Food Gets One Ink</h3><p>Bags and wrappers print Caribe on kraft or Masa only. Full colour is for cups, signs and the campaign.</p></li>
  <li><b>03</b><h3>The Seal Closes Everything</h3><p>The round Arepito seal is the sticker, the sign and the stamp. The full mascot appears only where there's room to play.</p></li>
  <li><b>04</b><h3>60 / 25 / 10 / 5</h3><p>Masa or kraft ground, Caribe for type and line, Maíz for warmth, Ají only for the one thing you should notice.</p></li>
  <li><b>05</b><h3>Three Voices</h3><p>Bricolage Grotesque to announce, Space Mono for labels and the menu, DM Sans to explain.</p></li>
  <li><b>06</b><h3>Plain Menu, Playful Campaign</h3><p>Menu items carry their regional names and plain descriptions. The jokes live in the campaign and the merch.</p></li></ol>
 </div></section>

 <section class="band ng section"><div class="wrap"><p class="eyebrow" style="color:#FFC233">05 · Launch campaign · Art direction + 3D</p><h2 class="sh-title" style="font-size:32px">Not Generated.</h2><p class="sh-sub">Five spots / One line / Raytraced in Rhino 9</p>
  <p class="intro">Everything is “generated” now. The launch flips the joke in the name: the one thing in your feed a model can’t make is an arepa pressed by hand. Arepito is shot like an athlete and the food like a product drop: one brand colour per set, a hard key light, two coloured rim lights, ingredients in flight and type that takes up half the frame.</p>
  <div class="ng-kv">${fig(AR.kv('run'),'01 · Not generated. Key visual, 16:9.')}</div>
  <div class="ng-grid">${AR.ng.slice(1).map(([n,k,c])=>fig(AR.kv(k),n+' · '+c)).join('')}</div>
  <div class="ng-post">${AR.ng.map(([n,k,c])=>fig(AR.po(k),n+' · Poster, 2:3')).join('')}</div>
  <div class="ng-sq">${AR.ng.map(([n,k,c])=>fig(AR.sq(k),n+' · Feed post, 1:1')).join('')}</div>
  <div class="ng-ooh">${fig(AR.ooh('wall'),'Wild posting: the full series on a street wall, modelled and lit in Rhino.')}${fig(AR.ooh('shelter'),'Backlit bus-shelter panel at night.')}</div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Brand Book</h2><p class="sh-sub">46 pages / Eight chapters / Loud on purpose</p>
  <div class="mono ar-board" style="padding-top:24px">${fig(AR.board,'The brand board: identity, palette, mascot and packaging on one page.')}</div>
  <div class="ar-book">${[['cover','Cover'],['contents','Contents'],['manifesto','Manifesto'],['logohero','The primary logo'],['colour','Colour'],['voice','Voice & tone'],['packaging','Packaging'],['3d_div','Chapter 07: Flat To Form'],['3d_pack','Packaging in 3D']].map(([k,c])=>fig(AR.pg(k),c,'ar-pg')).join('')}</div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Idea</h2><p class="sh-sub">The only algorithm is abuela's</p>
  <div class="cb-feature" style="padding-top:24px"><p class="intro" style="margin:0">The name is the joke; the craft is the promise. Arepa.AI borrows the language of tech launches (models, prompts, “generating…”) and points it at the least automated food there is: arepas pressed by hand and griddled to order, named after the regions of Colombia they come from.</p>
  <div class="stats" style="margin-top:0"><div><b>5</b><span>Brand colours</span></div><div><b>5</b><span>Mascot moods</span></div><div><b>46</b><span>Guideline pages</span></div><div><b>400+</b><span>Files, 2D + 3D</span></div></div></div>
  <div class="pra"><div><small>Voice</small><h3>Smart-Ass, Never About The Food</h3><p>Tech jargon for the menu, real respect for the recipe: “Trained on 300 years of abuela data.”</p></div>
  <div><small>Craft</small><h3>Hecho A Mano</h3><p>The counter is built around an open plancha, so the “AI” is a cook you can watch.</p></div>
  <div><small>Origin</small><h3>Colombian To The Core</h3><p>Choclo, huevo, boyacense, paisa: regional arepas, named and credited on every menu.</p></div></div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Identity</h2><p class="sh-sub">Wordmark / Pixel dot / “AI” chip / Icon</p>
  <p class="intro">A condensed, heavy wordmark that feels like a street sign, a square full stop that doubles as a blinking cursor, and “AI” set in a rounded chat tag. Four colourways, one rule: the chip always stays.</p>
  <div class="mono">${pg('logo','Logo suite: primary, horizontal, wordmark and app icon.')}</div>
  <div class="kn-duo">${pg('construct','Construction, clear space and minimum size.')}${pg('colourways','Approved colourways and five ways not to use the logo.')}</div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Meet Arepito</h2><p class="sh-sub">The smug little arepa who thinks he is an AI</p>
  <p class="intro">One weight of Caribe Blue line, a flat Maíz fill and toasted “pintas” from the plancha. His antenna is a single corn kernel that receives cravings; the sombrero vueltiao comes out for special occasions.</p>
  <div class="kn-duo">${pg('mascot','Character spec.')}${pg('expr','Five moods for five moments: smug, happy, thinking, spicy, in love.')}</div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Flat To Form</h2><p class="sh-sub">2D vector → 3D in Rhino 9 / One system, one more axis</p>
  <p class="intro">I rebuilt the packaging, the logo and Arepito in Rhino 9 from the same vector source as the 2D kit. The glyph outlines are extruded, the print art is mapped on as textures and the mascot is built from simple primitives. Nothing was redrawn, so the 2D and 3D versions can't drift apart.</p>
  <div class="mono">${pg('3d_div','Chapter 07 of the brand book: Flat To Form.')}</div>
  <div class="kn-duo">${pg('3d_char','Same Arepito, one more axis: five rules for taking the character into 3D.')}${pg('3d_process','Line, clay, colour: the same scene in three Rhino display modes.')}</div>
  <div class="ar-3d">${[['bag','Takeaway bags: the Pintas print as a texture map, folded top with an Arepito seal.'],['cup','TINTO.EXE cup: wrap-around sleeve, Caribe lid.'],['sandwich','Arepa in its deli wrapper, cut with a zig-zag tear line.']].map(([k,c])=>fig(AR.r3(k),c)).join('')}</div>
  <div class="ar-3d">${[['trio','Three moods: swap the face decal, keep the body.'],['arepito','Arepito with the sombrero vueltiao.'],['logo','The logo extruded: 22% depth and a raised “AI”.']].map(([k,c])=>fig(AR.r3(k),c)).join('')}</div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Colour, Type &amp; Voice</h2><p class="sh-sub">Corn, coast, chili, dough and char</p>
  <div class="kn-duo">${pg('colour','Five colours with print and screen values, and how much of each to use.')}${pg('type','Bricolage Grotesque for display, Space Mono as the “AI” voice, DM Sans for reading.')}</div>
  <div class="kn-duo">${pg('voice','Taglines and the do / don’t of the voice.')}${pg('patterns','Four patterns and an eight-icon set.')}</div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Packaging, Flat</h2><p class="sh-sub">The print artwork behind the 3D: Bag / Wrapper / Cup</p>
  <div class="ar-3">${AR.tiles.map(([k,c])=>fig(ARI(k,900,900),c)).join('')}</div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Merch, Menu &amp; App</h2><p class="sh-sub">Where the brand gets to play, so the food packaging can stay calm</p>
  <div class="ar-5">${AR.merch.map(([k,c])=>fig(ARI(k,900,900),c)).join('')}</div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Retail Experience</h2><p class="sh-sub">Objective / Insight / Approach · Prompt → Plancha → Pickup</p>
  <p class="intro">Structured like a retail launch deck: lunch menus feel like homework, so the shop replaces the menu wall with a Prompt Counter. You say a mood, and a cook “generates” the arepa on the plancha in front of you.</p>
  <div class="kn-duo">${pg('retail','Objective, insight and approach.')}${pg('journey','The three-step journey, prompt to pickup in under six minutes.')}</div>
  <div class="mono">${fig(ARI('store',1600,1000),'The Prompt Counter: mural, kiosk, menu screens, open plancha and counter.')}</div>
  <div class="kn-duo">${fig(ARI('storefront',1600,1000),'Storefront: Caribe fascia, Maíz awning, Arepito in the window.')}${fig(ARI('truck',1600,880),'Food truck: the same kit-of-parts on wheels.')}</div>
  <div class="mono">${pg('kit','Kit-of-parts and material specs: masa terrazzo, Caribe tile, white oak, Ají powder coat.')}</div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Kit</h2><p class="sh-sub">Everything a team needs to roll it out</p>
  <ol class="rs-steps">${AR.kit.map(([h,t],i)=>`<li><b>${n2(i)}</b><h3>${esc(h)}</h3><p>${esc(t)}</p></li>`).join('')}</ol>
  <p class="fine">Every file is vector with all type converted to outlines, so it opens in Illustrator without fonts. The .3dm opens in Rhino 8 or 9. Typefaces are open-licence (SIL OFL). Arepa.AI is a self-initiated concept brand; it is not a real business.</p>
 </div></section>

 <section class="statement">${im(ARI('store',1600,1000),'Inside the Arepa.AI Prompt Counter')}<p>Hola, <span class="it">humano.</span></p></section>
 ${nextLink('brand',{id:'basecamp',title:'BASECAMP'})}</main>`+foot();
}

function bcPage(){
 const I=BC.img;
 const fig=(r,c,cls='')=>`<figure class="${cls}">${im(r,c)}<figcaption>${esc(c)}</figcaption></figure>`;
 return head('product','New')+`<main>
 <section class="band dark"><div class="wrap case"><p class="num">New · Industrial Design / Concept</p><h1>BASECAMP</h1><p class="meta">Emergency radio + lantern · Model BC-01 · Python-scripted geometry · Blender Cycles</p>
  <p class="note">A hand-crank emergency radio and lantern for camp and power cuts. It stands upright on a shelf, the speaker faces you behind an orange perforated plate, and the lantern pops out of the top. Every fastener is a Torx screw you can reach, so it gets repaired, not replaced.</p>
  <dl class="facts"><div><dt>Role</dt><dd>Concept, industrial design, CMF, graphics</dd></div><div><dt>Tools</dt><dd>Python · Blender · Cycles · Tinkercad Circuits · Arduino</dd></div><div><dt>Output</dt><dd>Assembly, elevations, exploded view, electronics architecture, working behaviour prototype</dd></div><div><dt>Brand</dt><dd>Tigre Studio original concept</dd></div></dl></div></section>
 <div class="band dark" style="padding-bottom:56px"><div class="wrap"><div class="media tr-l bc-bg">${im(I.hero,'BASECAMP emergency radio and lantern, three-quarter view with the lantern up','heroimg')}</div></div></div>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Design Intent</h2><p class="sh-sub">Find it in the dark / Power it without an outlet / Fix it with a screwdriver</p>
  <div class="cols"><div><h3>Find It In The Dark</h3><p>SOS sits alone on top, in red. Light and radio get the two biggest buttons: orange for light, cream for radio. One knurled dial tunes the radio or dims the light, and a slider picks AM, FM or WX.</p></div>
  <div><h3>Power Without An Outlet</h3><p>A fold-out crank on the side charges two user-replaceable 18650 cells. USB-C (5 V, 2 A) charges it at home, and three LEDs show the charge. The diffuser lifts 40 mm out of the top and turns the radio into a lantern.</p></div>
  <div><h3>Built To Be Repaired</h3><p>Eight Torx T10 screws hold the front, four hold the back, and the label says so. Inside, every part is a separate, replaceable piece. Rated IPX4 for rain and splashes.</p></div></div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Elevations</h2><p class="sh-sub">Front / Back / Every callout is a decision</p>
  <div class="bc-duo">${fig(I.front,'Front elevation: lantern, SOS, perforated plate, Torx hardware, tune / dim dial, buttons and crank.','bc-bg')}${fig(I.back,'Rear elevation: four T10 screws, USB-C and the spec label printed on the part.','bc-bg')}</div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Size &amp; Envelope</h2><p class="sh-sub">160 × 64 × 128 mm / Lantern +40 mm / Will it fit your shelf?</p>
  <p class="intro">Every number here is read from the same Python script that built the renders, so the drawing is the geometry, not a sketch of it. Pop the lantern and the height changes; set the clear height under your shelf and the drawing checks the fit.</p>
  <div class="grl env" data-env></div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Product Architecture</h2><p class="sh-sub">Twelve parts / One stack / Screws you can reach</p>
  <div class="bc-arch"><figure class="bc-bg">${im(I.exp,'BASECAMP exploded assembly')}</figure>
  <div><p class="intro" style="margin-top:0">The exploded view is the spec. Each layer is a real part with its own material, from the controls and the perforated plate at the front, through the board and shell, to the cells and the back plate.</p>
  <ol class="bc-parts">${BC.parts.map((t,i)=>`<li><b>${n2(i)}</b>${esc(t)}</li>`).join('')}</ol></div></div>
 </div></section>


 <section class="band dark section el-sec"><div class="wrap"><p class="num" style="color:var(--yellow)">Electronics · Development</p><h2 class="sh-title" style="font-size:32px">From Block Diagram To Working Behaviour</h2><p class="sh-sub">Define / Architect / Stand in / Wire / Code / Simulate / Debug</p>
  <p class="intro">An industrial design is only half a product. Before any board is drawn, I want to know that the controls behave the way the form promises: one dial that tunes or dims, a crank that visibly charges, an SOS you can trigger in the dark. So I designed the electronics in two layers: the real architecture of the product, and a working prototype of its behaviour in Tinkercad Circuits, with every part of the product represented by a stand-in.</p>
  <ol class="el-steps">
   <li><b>01</b><h3>Define</h3><p>Write the rules: what each control does in each mode, how the battery drains and charges, the SOS timing.</p></li>
   <li><b>02</b><h3>Architect</h3><p>Block diagram of the real product: power path, radio, lantern driver, controller.</p></li>
   <li><b>03</b><h3>Stand In</h3><p>Map every real part to a simulator part that behaves the same way.</p></li>
   <li><b>04</b><h3>Wire</h3><p>Build the circuit on an Arduino Uno, colour-coded by function.</p></li>
   <li><b>05</b><h3>Code</h3><p>Firmware in Arduino C++: one loop, six states.</p></li>
   <li><b>06</b><h3>Simulate</h3><p>Run it, press every button, turn the dial, find what breaks.</p></li>
   <li><b>07</b><h3>Next</h3><p>Real parts, a KiCad board shaped by the shell, a power budget.</p></li>
  </ol>
  <figure class="el-fig">${im(I.elBlock,'BASECAMP system architecture block diagram: crank and USB-C power, charger, cells, rails, MCU, radio, amplifier, lantern driver, SOS')}<figcaption>02 · The real product. Orange is power, black is signal. The crank and USB-C feed one charger; a quiet regulator keeps switching noise out of the radio.</figcaption></figure>
 </div></section>

 <section class="band light section el-sec"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Behaviour Prototype</h2><p class="sh-sub">Every product part / One simulator stand-in / Tinkercad Circuits</p>
  <div class="el-two">
   <div><p class="intro" style="margin-top:0">A simulator does not have a hand crank or a weather-band radio chip, so each part of the product gets a stand-in that behaves the same way from the user's side. The table is the contract between the prototype and the product.</p>
   <table class="tbl el-map"><thead><tr><th>Product part</th><th>Prototype stand-in</th><th>Pin</th></tr></thead><tbody>
    <tr><td>TUNE / DIM dial (rotary encoder)</td><td>250 kΩ potentiometer</td><td>A0</td></tr>
    <tr><td>LIGHT · RADIO · SOS buttons</td><td>Pushbuttons, internal pull-ups</td><td>D2 · D3 · D4</td></tr>
    <tr><td>AM / FM / WX slider</td><td>BAND button, cycles the three bands</td><td>D5</td></tr>
    <tr><td>Hand crank + charger</td><td>CRANK button, hold to charge</td><td>D7</td></tr>
    <tr><td>Radio IC + amp + speaker</td><td>Piezo, pitch follows the dial</td><td>D8</td></tr>
    <tr><td>Lantern LED driver</td><td>White LED on PWM + 220 Ω</td><td>D9</td></tr>
    <tr><td>Fuel gauge → 3 charge LEDs</td><td>3 orange LEDs + 220 Ω</td><td>D10–D12</td></tr>
    <tr><td>(debug window)</td><td>16×2 LCD over I²C</td><td>A4 · A5</td></tr>
   </tbody></table>
   <p class="fine">Two honest gaps: the simulator's slide switch has only two positions, so the three-band slider became a button, and its DC motor cannot be turned by hand, so the crank became a hold-to-charge button.</p></div>
   <figure class="el-fig">${im(I.elProto,'Tinkercad breadboard prototype of BASECAMP with callouts')}<figcaption>04 · The wired prototype. Yellow is an input, black is ground, red is 5 V, orange and grey feed the LEDs, blue and purple carry I²C to the display.</figcaption></figure>
  </div>
  <div class="bc-duo">${fig(I.elSch,'The schematic Tinkercad generates from the wiring: 5 switches, 4 LEDs, 4 resistors, the dial, the piezo and the I²C display around the Uno.','bc-bg')}${fig(I.elCode,'Firmware excerpt: a pin-change interrupt catches every press, and the display text is built in fixed buffers.','bc-bg')}</div>
 </div></section>

 <section class="band dark section el-sec"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Behaviour, Simulated</h2><p class="sh-sub">Ready / Lantern / Radio FM / Radio WX / SOS / Crank</p>
  <p class="intro">Six states from one loop, captured from the running simulation. The display stands in for what the product would tell you through light and sound; the LEDs and piezo are the parts the product actually has.</p>
  <p class="intro" style="margin-bottom:18px"><b>Live:</b> the same firmware rules, ported to JavaScript and running right here. It plays a demo on its own; press anything to take over.</p>
  <div class="sim" data-sim="bc"></div>
  <figure class="el-fig">${im(I.elStates,'Six simulated states of the BASECAMP prototype: ready, lantern, FM radio, WX radio, SOS beacon, crank charging')}<figcaption>06 · LIGHT dims with the dial. RADIO maps the same dial to 87.9–107.9 MHz, 530–1700 kHz or the seven NOAA weather channels. SOS flashes · · · — — — · · · on the lantern. The crank fills the bars.</figcaption></figure>
  <div class="cols" style="padding-top:32px"><div><h3>One Dial, Two Jobs</h3><p>The dial position is read once per loop and given meaning by the mode: brightness when the lantern is on, a station when the radio is on. One physical control, no menu.</p></div>
  <div><h3>A Battery You Can See</h3><p>Every mode draws from a shared battery value. Three LEDs show it in thirds, and while you crank the next bar blinks, so the effort has visible feedback.</p></div>
  <div><h3>SOS Without Thinking</h3><p>SOS overrides everything else and plays the international pattern at 150 ms units on the lantern and buzzer until you press it again.</p></div></div>
 </div></section>

 <section class="band light section el-sec"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Debug Log</h2><p class="sh-sub">What broke / Why / The fix</p>
  <ol class="el-log">
   <li><b>01</b><div><h3>Wires drawn, nothing connected</h3><p>The first build ran but nothing lit. The wires existed on screen but the connections between them were never registered as electrical nets. Rebuilding the circuit through the editor's own change history fixed the netlist.</p></div></li>
   <li><b>02</b><div><h3>"Invalid header file"</h3><p>The compiler rejected the sketch with an error that pointed nowhere. Compiling cut-down versions narrowed it to one line: starting the serial port alongside the display library. Removing the unused serial line fixed it.</p></div></li>
   <li><b>03</b><div><h3>Quick presses were missed</h3><p>The display is slow to redraw, and a short click could happen between two reads of the button. A pin-change interrupt now latches every press the moment it happens, and the main loop collects them.</p></div></li>
   <li><b>04</b><div><h3>Frozen after a minute</h3><p>Building display text with String objects slowly fragmented the Uno's 2 KB of memory until the program stalled. The text is now built in fixed buffers, and the display only redraws a line when it changes.</p></div></li>
  </ol>
  <div class="el-next"><small>Next</small><h3>From Behaviour To A Real Board</h3><p>Pick the real parts (receiver IC, charger, LED driver, encoder), write the power budget, then draw the schematic and a KiCad board whose outline comes straight from the BASECAMP shell geometry, with the encoder and buttons exactly where the industrial design puts them.</p></div>
 </div></section>
 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">A Parametric Grille</h2><p class="sh-sub">Rule → code / 150 holes / Ø 2.0 → 1.1 mm / Try it below</p>
  <p class="intro">The speaker holes are not a pattern from a library. They follow a rule: 150 holes on a Fermat spiral, 2.0 mm at the centre where the driver needs the most open area, shrinking to 1.1 mm at the edge, where the plate needs strength around the screws. Change the hole count or the size range and the plate regenerates. It is the same method as the Rules → Code tools on my homepage. The generator below runs the same rule as the Blender script that cut the rendered plate.</p>
  <div class="grl" data-grl></div>
  <div class="bc-duo">${fig(I.spk,'The grille up close: graded holes, the tick ring and the Torx screws.','bc-bg')}${fig(I.dial,'Controls: knurled aluminium dial with a printed scale, charge LEDs, band slider, and the light and radio buttons.','bc-bg')}</div>
 </div></section>

   <div><small>Approach</small><h3>Generate The Pattern On The Solid</h3><p>A Grasshopper 2 definition lays cells over the top face and side walls, insets each into a tile and cuts the gaps as grooves with one solid boolean. Keep-out zones around the key pockets, knob and USB-C recess are left clear automatically, each with a margin.</p></div>

  <p class="intro">The case says what the keypad should do: four launcher keys, an orange power key and a knurled knob. Before any board is drawn, I wanted to prove that behaviour works. So I designed the electronics in two layers: the real architecture of a USB keypad, and a working prototype of its behaviour in Tinkercad Circuits, with every part of the keypad represented by a stand-in.</p>

   <li><b>04</b><h3>Wire</h3><p>Build the circuit on an Arduino Uno, laid out like the keypad itself.</p></li>
   <li><b>05</b><h3>Code</h3><p>Firmware in Arduino C++: sleep, wake, launch, three knob modes.</p></li>
   <li><b>06</b><h3>Simulate</h3><p>Press every key, hold power, push and turn the knob, find what breaks.</p></li>

 'electric-guitar':{sub:'A launch set built from one Rhino file',
  extra:()=>{
   const L=647.7, M=[611.35,577.04,544.65,514.08,485.23,457.99,432.29,408.03,385.12,363.51,343.11,323.85,305.67,288.52,272.32,257.04,242.61,229.0,216.14,204.01,192.56];
   const d=n=>L*(1-Math.pow(2,-n/12)), X=v=>40+v/L*1120, mk=[3,5,7,9,12,15,17,19,21];
   const fr=Array.from({length:21},(_,i)=>i+1);
   const svg=`<svg class="eg-fret" viewBox="0 0 1200 210" role="img" aria-label="Fret positions along the 647.7 mm scale">
    <rect x="40" y="62" width="${X(d(21))-40}" height="56" fill="#2A1A12"/>
    ${fr.map(n=>`<line x1="${X(d(n))}" y1="58" x2="${X(d(n))}" y2="122" stroke="#D9D6CF" stroke-width="2"/>`).join('')}
    ${mk.map(n=>{const x=(X(d(n))+X(d(n-1)))/2;return n===12?`<circle cx="${x}" cy="80" r="4" fill="#EFE7D2"/><circle cx="${x}" cy="100" r="4" fill="#EFE7D2"/>`:`<circle cx="${x}" cy="90" r="4" fill="#EFE7D2"/>`}).join('')}
    <rect x="34" y="56" width="6" height="68" fill="#EFE7D2"/>
    <line x1="1160" y1="40" x2="1160" y2="140" stroke="#FF5A1F" stroke-width="2"/>
    ${mk.map(n=>`<text x="${X(d(n))}" y="140" text-anchor="middle">${n}</text>`).join('')}
    <line x1="40" y1="24" x2="1160" y2="24" stroke="currentColor" stroke-width="1"/><line x1="40" y1="18" x2="40" y2="30" stroke="currentColor"/><line x1="1160" y1="18" x2="1160" y2="30" stroke="currentColor"/>
    <text x="600" y="16" text-anchor="middle">SCALE 647.7 MM · 25.5 IN · NUT TO SADDLE LINE</text>
    <line x1="40" y1="172" x2="${X(d(12))}" y2="172" stroke="#FF5A1F"/><text x="${(40+X(d(12)))/2}" y="192" text-anchor="middle" fill="#FF5A1F">FRET 12 = L / 2 = 323.85 MM</text>
    <text x="1160" y="160" text-anchor="end" fill="#FF5A1F">SADDLES</text><text x="40" y="160">NUT</text></svg>`;
   const rows=[1,2,3,5,7,12,17,21].map(n=>`<tr><td>${String(n).padStart(2,'0')}</td><td>${d(n).toFixed(2)}</td><td>${(L-M[n-1]).toFixed(2)}</td><td>${Math.abs(d(n)-(L-M[n-1])).toFixed(2)}</td></tr>`).join('');
   const sad=[['E6',11.2],['A5',9.9],['D4',8.6],['G3',10.6],['B2',8.9],['E1',7.0]];
   const fin=[['img/eg__front_sunburst.webp','3-Tone Burst','#B4380B','Graded burst, tinted by distance from the body edge'],['img/eg__front_orange.webp','Tigre Orange','#E8400A','Metallic orange, parchment guard'],['img/eg__front_ice.webp','Ice Blue','#9CC9D6','Metallic pale blue, parchment guard'],['img/eg__front_ink.webp','Ink Black','#101012','Gloss black, white guard']];
   return `<section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Finish Range</h2><p class="sh-sub">Four finishes / one file / material swaps only</p>
    <div class="eg-fin">${fin.map(([k,n,c,t])=>`<figure>${im([k,1800,810],n+' finish, front elevation')}<figcaption><span class="sw" style="background:${c}"></span><b>${n}</b> ${t}</figcaption></figure>`).join('')}</div>
   </div></section>
   <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Math Of The Neck</h2><p class="sh-sub">Every fret placed by equal temperament, then checked against the model</p>
    ${svg}
    <div class="eg-math"><div><p class="eg-eq">d<sub>n</sub> = L · (1 − 2<sup>−n/12</sup>)</p><p>Each fret shortens the vibrating string by one equal-tempered semitone, a factor of 2<sup>1/12</sup>. With L = 647.7 mm, fret 12 lands at exactly half the scale. The model's 21 frets were placed from the formula, not by eye: the table reads the fret centres straight back out of the Rhino file.</p></div>
    <table class="tbl eg-tab"><thead><tr><th>Fret</th><th>Formula mm</th><th>Model mm</th><th>Δ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3 class="eg-h3">Saddle Compensation</h3><p class="eg-p">A fretted string goes sharp because pressing it stretches it. Each saddle sits behind the theoretical scale line to correct that: wound strings and the plain G need the most. These setbacks are read from the model.</p>
    <div class="eg-sad">${sad.map(([n,v])=>`<div><span style="width:${v/14*100}%"></span><b>${n}</b><i>${v.toFixed(1)} mm</i></div>`).join('')}</div>
   </div></section>
   <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Assembly</h2><p class="sh-sub">230 parts / 7 sub-assemblies</p>
    <div class="f1-set"><figure>${im(['img/eg__exploded.webp',1700,1040],'Exploded assembly over a 25 mm grid')}<figcaption>Exploded on a 25 mm grid: back plate and spring claw, body, tremolo, pickguard assembly, knobs, and the neck slid out of its pocket.</figcaption></figure></div>
    <dl class="eg-bom">${[['Neck','84','Neck, fretboard, 21 frets, 20 face and side dots, nut, six tuners at six parts each, string tree, truss-rod nut'],['Body','6','Body, jack plate, jack nut and insert, two strap buttons'],['Tremolo','46','Plate, six mounting screws, sustain block, six saddles, twelve height screws, intonation screws, springs and washers, arm and tip'],['Pickguard','37','Three-ply guard, three pickup covers, 18 pole pieces, eleven screws, switch lever and tip'],['Controls','9','Volume and two tone knobs, three parts each'],['Back','16','Tremolo cover and six screws, spring claw, three springs, neck plate and four screws'],['Strings','32','Six strings, plain and wound, modeled in segments, with their post wraps']].map(([k,n,t])=>`<div><dt>${k}<b>${n}</b></dt><dd>${t}</dd></div>`).join('')}</dl>
   </div></section>

   const r=c.querySelector('.vx-rig').getBoundingClientRect();
   if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){insert(el.dataset.t)}else{el.style.transition='transform .3s';el.style.transform=''}});
  el.addEventListener('click',e=>{if(e.detail===0) insert(el.dataset.t)});   // keyboard
 });
 c.querySelector('[data-a=eject]').onclick=()=>eject();
 c.querySelector('[data-a=play]').onclick=()=>{cur&&setPlay(!playing)};
 c.querySelector('[data-a=stop]').onclick=()=>{if(cur){setPlay(false);sec=0;vr.textContent='00:00'}};
 c.querySelector('[data-a=ff]').onclick=()=>{if(cur){frame++;sec+=30;show();vr.textContent=fmt(sec)}};
 c.querySelector('[data-a=rew]').onclick=()=>{if(cur){frame=Math.max(0,frame-1);sec=Math.max(0,sec-30);show();vr.textContent=fmt(sec)}};
}

  return `<div class="tt-dial"><svg viewBox="0 0 200 200" aria-hidden="true">${capDef}${t}<text class="lbl" x="100" y="140">LOCAL TIME</text><g class="tt-ndl hd" data-h style="--a:0deg"><path class="sh" d="M98.2 108 L99 52 L101 52 L101.8 108 Z"/></g><g class="tt-ndl hd" data-m style="--a:0deg"><path class="sh" d="M98.8 110 L99.4 26 L100.6 26 L101.2 110 Z"/></g><g class="tt-ndl hd" data-s style="--a:0deg"><path class="tp" d="M99.5 118 L99.7 20 L100.3 20 L100.5 118 Z"/></g><circle class="cap" cx="100" cy="100" r="5"/></svg></div>`};
 const nx=RH[0];
 return head('product','AI')+`<main>
 <section class="band dark"><div class="wrap case"><p class="num">AI Design Systems / Standard Play</p><h1>Standard Play</h1><p class="meta">An open library of design systems on tape</p>
  <p class="note">I wanted to find out how far I could push an AI as a production partner while keeping the taste and the decisions mine. The result is a free library of Figma design systems, each one named like a tape and drawn from a piece of old hardware.</p>
  <dl class="facts f5"><div><dt>My role</dt><dd>Founder, designer</dd></div><div><dt>Built with</dt><dd>Claude · Figma · Figma MCP</dd></div><div><dt>Output</dt><dd>5 Figma libraries + public site</dd></div><div><dt>Scale</dt><dd>240 variables · 35 component sets · 46 icons</dd></div><div><dt>CMF</dt><dd>25 materials · 5 tapes · Blender Cycles</dd></div></dl></div></section>
 <section class="band dark" style="padding-bottom:56px"><div class="wrap"><figure class="mono" style="margin:0;padding-top:0"><div class="media tr-l">${im(['img/spr__shelf.webp',1800,860],'The five Standard Play tapes on a shelf: four VHS sleeves, T-120, T-60, T-90 and T-160, and the C-46 audio cassette case, with two cassettes in front','heroimg')}<div class="sp-hot" aria-hidden="true"><span style="left:7.5%;top:11%"><b>01</b>SBS BOARD · PET OVERLAY · 90 GU</span><span style="left:66%;top:29%"><b>02</b>CLEAR PS CASE · PRINTED J-CARD</span><span style="right:2%;top:24%"><b>03</b>POWDER-COAT BOOKEND · KNURLED AL</span><span style="left:12%;top:90%"><b>04</b>STIPPLE ABS · SMOKED PC WINDOW</span><span style="left:70%;top:89%"><b>05</b>SMOKED SHELL · VFD-TEAL LABEL</span></div></div><figcaption>The shelf, rebuilt with production CMF: printed SBS board under a gloss PET overlay for the sleeves, a clear polystyrene case for the C-46, stipple ABS and smoked polycarbonate for the cassettes, on a graphite powder-coat plinth with an orange anodised edge. The shelf and tape shots are Vizcom render passes over the Blender scenes: geometry, artwork and colour come from the model, the pass adds real board, plastic and light. Where the pass misread the small print, the original sleeve artwork and labels were put back.</figcaption></figure>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Object First, Tokens Second</h2><p class="sh-sub">Every tape starts as a physical object / 25 materials, rebuilt in Blender, finished in Vizcom, specified like production CMF</p>

  ${spCmf()}
  </div>

 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Who Did What</h2><p class="sh-sub">Direction stays human; production is shared</p>

  <div><h3>Claude's work</h3><ul><li>Turning each direction into tokens: primitives, Night/Daylight semantic colors, spacing, radius</li><li>Writing the Figma Plugin API scripts that built variables, text styles, effects and components</li><li>Drawing the 46 Telltales icons on a 24px grid</li><li>Building the public Standard Play site</li></ul></div></div>

 <section class="band light"><div class="wrap" style="padding-bottom:64px"><h2 class="sh-title" style="font-size:32px">The Shelf</h2><p class="sh-sub">Five tapes, five eras / Each one boxed like the real thing</p>${rows}</div></section>

 </div></section>
 ${nextLink('rhino',nx)}</main>`+foot();

function cookbookPage(){
 const I=CB.img;
 return head('product','CB')+`<main>
 <section class="band dark"><div class="wrap case"><p class="num">Personal Project / Cookbook</p><h1>Fold / Bake</h1><p class="meta">A real-scale parchment cookbook · Chapter 1: Colombia</p>
  <p class="note">Every page is a cooking sheet. Lay each ingredient on its true-size outline, fold the page over the food, crimp the edges and bake. The drawing is the measurement.</p>
  <dl class="facts"><div><dt>Role</dt><dd>Concept, writing, illustration, code</dd></div><div><dt>Tools</dt><dd>Python · Illustrator · Rhino</dd></div><div><dt>Output</dt><dd>A3 sheets · SVG, PDF, DXF</dd></div><div><dt>Status</dt><dd>Chapter 1 drafted · kitchen testing next</dd></div></dl></div></section>
 <div class="band dark" style="padding-bottom:56px"><div class="wrap">${fbHTML(I.co01[0])}<noscript><div class="media paper tr-l">${im(I.co01,'Pescado al Coco recipe sheet','heroimg')}</div></noscript></div></div>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Why A Cookbook</h2><p class="sh-sub">The idea / The reason / The connection</p>
  <div class="cols"><div><h3>The Idea</h3><p>A cookbook you cook on. Each recipe is printed on baking parchment with the ingredients drawn at their real size, so the page shows exactly how much to use and where it goes.</p></div>
  <div><h3>Why It Matters To Me</h3><p>I wanted a book that lets anyone make a quick, real meal in whatever oven they have, from a full-size range to a countertop air fryer. It opens with Colombian home cooking, the dishes I wanted on its first pages.</p></div>
  <div><h3>What It Borrows From Nike</h3><p>For 16 years I wrote the manuals factories built from: exploded views, tolerances and steps a line can repeat. A recipe is the same problem. If the drawing is right, anyone can make it.</p></div></div></div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">How A Page Works</h2><p class="sh-sub">One A3 sheet / Two halves / One fold</p>
  <ol class="anat">${CB.anat.map((t,i)=>`<li><b>${n2(i)}</b>${t}</li>`).join('')}</ol>
  <div class="cb-pair"><figure><div class="media paper tr">${im(I.top,'Top half of the Pollo Sudado sheet: title, ingredients, method and oven guide')}</div><figcaption>The top half: recipe, method and a five-row oven guide. It folds down over the food.</figcaption></figure>
  <figure><div class="media paper bl">${im(I.serving,'One serving of Pescado al Coco drawn at true size')}</div><figcaption>One serving at true size. A tablespoon of coconut milk is drawn as a 10 mm-deep pool of the right area.</figcaption></figure></div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Designed For Any Oven</h2><p class="sh-sub">Full-size / Fan / Toaster / Air fryer / High altitude</p>
  <p class="intro">Most cookbooks assume one oven. This one doesn't. A full-size oven bakes the whole sheet as one pouch. A toaster or air-fryer oven takes half: cut on the center line and each side becomes its own single-serving pouch, with its own crimp edge.</p>
  <ul class="docs" style="margin-top:32px">${CB.ovens.map(([n,k,d])=>`<li><span class="d">${k}</span><b>${n}</b><span class="k">${d}</span></li>`).join('')}</ul>
  <div class="cb-wide"><figure><div class="media paper tr-l">${im(I.food,'Maduro con Queso y Bocadillo food half, split into two servings by a center cut line')}</div><figcaption>The center cut line turns one sheet into two small pouches for countertop ovens.</figcaption></figure></div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Built As A System, Not Drawn By Hand</h2><p class="sh-sub">Python / SVG / PDF / DXF</p>
  <div class="cols"><div><h3>Parametric Ingredients</h3><p>35 ingredients written as code: a salmon fillet, a plantain, a shrimp, a lime slice. Each takes real dimensions, so changing a portion redraws it at the new size.</p></div>
  <div><h3>One Source, Three Outputs</h3><p>One generator builds every page as layered SVG for Illustrator, vector PDF for print and Rhino, and DXF in millimetres. Outlines, details, labels, text and fold lines each sit on their own layer.</p></div>
  <div><h3>Checked Like A Spec</h3><p>The build flags any ingredient that crosses a crimp edge or collides with a label, and every page carries a 100 mm bar to prove the print scale.</p></div></div>
  <div class="cb-wide"><figure><div class="media paper bl-l">${im(I.art,'Line-up of true-size Colombian ingredients: plantain, cilantro, papa criolla, lime, corn, chorizo, bocadillo and queso')}</div><figcaption>Part of the ingredient library, all at true size: maduro, cilantro, papa criolla, lime, corn, chorizo, bocadillo and queso.</figcaption></figure></div>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">From One Sheet To A Book</h2><p class="sh-sub">Version 1 / Version 2</p>
  <div class="cb-pair"><figure><div class="media paper tr">${im(I.v1,'Version 1: a single salmon recipe sheet')}</div><figcaption>Version 1: one sheet, food spread across the page. It only worked in a full-size oven.</figcaption></figure>
  <figure><div class="media paper bl">${im(I.co05,'Version 2: Maduro con Queso y Bocadillo sheet with a center cut line')}</div><figcaption>Version 2: one serving per side of a cut line, an oven guide on every page, and a structure that grows by chapter.</figcaption></figure></div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Chapter 1: Colombia</h2><p class="sh-sub">Five recipes / Five recipes per chapter to follow</p>
  <ul class="docs" style="margin-top:32px">${CB.recipes.map(([c,t,e,m])=>`<li><span class="d">${c} · ${m}</span><b>${t}</b><span class="k">${e}</span></li>`).join('')}</ul>
 </div></section>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Pages</h2><p class="sh-sub">Intro / Chapter opener / Five recipes</p>
  ${gal([[...I.intro,'How this book works: folding, oven guide, parchment safety'],[...I.chapter,'Chapter opener: Colombia'],[...I.co01,'CO-01 · Pescado al Coco'],[...I.co02,'CO-02 · Pollo Sudado'],[...I.co03,'CO-03 · Chorizo con Papa Criolla'],[...I.co04,'CO-04 · Mazorca con Hogao y Queso'],[...I.co05,'CO-05 · Maduro con Queso y Bocadillo']],'Fold / Bake page')}
 </div></section>

 <section class="statement">${im(I.food,'Maduro con queso y bocadillo, drawn at true size')}<p>If the drawing is right, <span class="it">anyone can make it.</span></p></section>
 ${nextLink('product',{id:'standard-play',title:'Standard Play'})}</main>`+foot();
}

   const m=src==='d'?null:mats[+src-1];c.querySelector(`[data-src="${k}"]`).innerHTML=m?`<b>${src}</b>${esc(m[1])}`:`<b>—</b>Derived`}

 };
 const stop=()=>{cancelAnimationFrame(raf);raf=0;play.setAttribute('aria-pressed','false');play.textContent='▶ PLAY';meter(0)};

/* Mechanical switch sounds, synthesized live (no samples): clicky switch = click-jacket snap at actuation,
   bottom-out thock into the plate, softer upstroke clack on release. Encoder = detent ticks. */
function switchSfx(){
 let ac=null,bus=null,nz=null,on=true,heard=false;
 const make=()=>{if(ac)return ac;const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
  try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}
  ac=new A();const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
  const plate=ac.createBiquadFilter();plate.type='peaking';plate.frequency.value=1150;plate.Q.value=2.2;plate.gain.value=5;  // case/plate resonance
  bus=ac.createGain();bus.gain.value=.9;bus.connect(plate).connect(comp).connect(ac.destination);
  nz=ac.createBuffer(1,ac.sampleRate*.25,ac.sampleRate);const d=nz.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return ac};
 const burst=(t,{f,q=1,type='bandpass',dur,peak,att=.0006})=>{const s=ac.createBufferSource();s.buffer=nz;s.playbackRate.value=.8+Math.random()*.4;
  const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl).connect(g).connect(bus);s.start(t,Math.random()*.15);s.stop(t+dur+.02)};
 const body=(t,f0,dur,peak)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
  o.frequency.setValueAtTime(f0*1.6,t);o.frequency.exponentialRampToValueAtTime(f0,t+.012);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.02)};
 const ping=(t,f,dur,peak)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.01)};
 const r=(a)=>1+(Math.random()*2-1)*a;
 const api={
  get on(){return on},
  // call from a user gesture: creates / resumes the audio context
  wake(){if(!on)return;const c=make();if(c&&c.state!=='running')c.resume();heard=true},
  set(v){on=v;if(v)api.wake();else if(ac)ac.suspend()},
  // kind: 'key' launcher keycap · 'big' power key · 'push' encoder push switch
  down(kind){if(!on||!heard||!ac||ac.state==='closed')return;const t=ac.currentTime+.003;
   if(kind==='push'){burst(t,{f:3200*r(.1),q:2.5,dur:.012,peak:.35});body(t+.004,520*r(.05),.025,.12);return}
   const big=kind==='big';
   burst(t,{f:(big?3600:4300)*r(.08),q:3,dur:.010,peak:big?.55:.6});                 // click jacket snap
   ping(t,(big?2900:3500)*r(.04),.018,.05);                                           // spring/stem ping
   const tb=t+(big?.016:.011)*r(.15);                                                 // bottom-out after the rest of the travel
   burst(tb,{f:big?520:900,type:'lowpass',q:.7,dur:big?.07:.045,peak:big?.75:.55});    // keycap into plate
   body(tb,(big?150:235)*r(.05),big?.09:.055,big?.32:.22);                             // case thock
   if(big)burst(tb+.006,{f:2100,q:6,dur:.03,peak:.08})},                               // stabiliser rattle
  up(kind){if(!on||!heard||!ac||ac.state==='closed')return;const t=ac.currentTime+.003,big=kind==='big';
   if(kind==='push'){burst(t,{f:2600,q:2,dur:.008,peak:.16});return}
   burst(t,{f:(big?3000:3800)*r(.08),q:3,dur:.008,peak:big?.25:.28});                 // jacket resets
   burst(t+.009*r(.2),{f:big?700:1200,type:'lowpass',dur:.03,peak:big?.3:.22});       // stem tops out
   body(t+.009,(big?190:300)*r(.05),.03,.08)},
  tick(){if(!on||!heard||!ac||ac.state==='closed')return;const t=ac.currentTime+.002;burst(t,{f:5200*r(.1),q:4,dur:.006,peak:.22});ping(t,2400*r(.05),.008,.03)},
  close(){ac&&ac.close();ac=null}};
 return api}

function simKP(el){
 const fx=switchSfx(),kind=k=>k==='PWR'?'big':k==='PUSH'?'push':'key';
 const keys=[1,2,3,4].map(i=>`<div class="sim-kc">${simLed('k'+i,'#ffffff',7,'#5aa9ff')}<button type="button" class="sim-btn sim-cap" data-k="K${i}" aria-label="Launcher key ${i}"><b>0${i}</b><span>AI.0${i}</span></button></div>`).join('');
 const o={tag:'Keypad · firmware port · same rules as the Arduino',lcdTag:'Host computer · what USB would send',knob0:520,knobPush:'PUSH',
  hint:'Hold <b>POWER</b> 2 s to wake · tap a key · drag the knob · tap the knob to switch mode · sound: synthesized clicky switches, plate thock and encoder detents',
  hd:'<button type="button" class="sim-snd" aria-pressed="true">🔊 Clicks on</button>',
  sfx(k,d,user){if(user)fx.wake();d?fx.down(kind(k)):fx.up(kind(k))},
  onKnob(a,b){const n=x=>Math.floor(x/1023*30);if(n(a)!==n(b))fx.tick()},
  dev:`<div class="sim-kp"><div class="sim-keys">${keys}<div class="sim-kc">${simLed('pw','#ff5a1f',7)}<button type="button" class="sim-btn sim-cap sim-or" data-k="PWR" aria-label="Power key, hold 2 seconds"><b>⏻</b><span>Hold 2 s</span></button></div></div>
   <div class="sim-kr">${simKnob('Knob')}<button type="button" class="sim-btn sim-push" data-k="PUSH">Push · Mode</button></div></div>`,
  script:[[1800,'hold','PWR',2300],[3400,'press','K1'],[1900,'press','K3'],[1900,'knob',980,1400],[1700,'press','PUSH'],[700,'knob',380,1400],[1700,'press','PUSH'],[700,'knob',820,1300],[1700,'press','K4'],[2200,'hold','PWR',2300],[2600,'knob',520,600]],loopReset:true,
  reset(S){Object.assign(S,{on:false,mode:0,lastPos:-1,flash:[0,0,0,0],pwrDown:0,pwrDone:false,msgUntil:0,msg:['',''],sweep:-1})},
  tick(S,t,io){
   const ledsK=[0,0,0,0];let pwmP=255,l1,l2;
   if(S.sweep>=0){const d=t-S.sweep;
    if(d<720){for(let i=0;i<4;i++)ledsK[i]=d<360?(i<=Math.floor(d/90)):(i>Math.floor((d-360)/90));
     ledsK.forEach((v,i)=>io.led('k'+(i+1),v));io.led('pw',1);return}
    S.sweep=-1}
   const pwr=!!S.down.PWR; hit(S,'PWR');
   if(pwr){if(!S.pwrDown)S.pwrDown=t;if(!S.pwrDone&&t-S.pwrDown>2000){S.pwrDone=true;S.on=!S.on;if(S.on){S.sweep=t;S.msg=['KEYPAD ON','READY'];S.msgUntil=t+720+1200;S.lastPos=-1}}}
   else{if(S.pwrDown&&!S.pwrDone&&S.on){S.msg=['HOLD POWER 2 S','TO SLEEP'];S.msgUntil=t+1200}S.pwrDown=0;S.pwrDone=false}
   const pos=Math.floor(S.knob*100/1023);
   if(!S.on){const b=Math.floor(t/8)%512;pwmP=Math.floor(b<256?b/4:(511-b)/4);['K1','K2','K3','K4','PUSH'].forEach(k=>S.hits[k]=false);l1=pwr?'WAKING...':'ASLEEP';l2='HOLD POWER 2 S'}
   else{
    for(let i=0;i<4;i++){if(hit(S,'K'+(i+1))){S.msg=[`AI.0${i+1}  LAUNCH`,`> CTRL+ALT+${i+1}`];S.msgUntil=t+1500;S.flash[i]=t+450}ledsK[i]=!(t<S.flash[i]&&Math.floor(t/75)%2)}
    if(hit(S,'PUSH')){S.mode=(S.mode+1)%3;S.lastPos=-1}
    if(S.lastPos>=0&&Math.abs(pos-S.lastPos)>=2)S.msgUntil=0;
    if(S.lastPos<0||Math.abs(pos-S.lastPos)>=2)S.lastPos=pos;
    if(t<S.msgUntil){[l1,l2]=S.msg}
    else{const p=S.lastPos,v=Math.trunc((p-50)/5);
     l1=S.mode===0?`VOL ${String(p).padStart(3)}% `:S.mode===1?`SCROLL ${((v<0?'-':'+')+Math.abs(v)).padStart(3)} `:`ZOOM ${String(50+Math.floor(p*3/2)).padStart(3)}% `;
     const bars=Math.floor(p/15);let k=0;while(l1.length<16){l1+=k<bars?'#':'.';k++}
     l2='KNOB: '+['VOL','SCROLL','ZOOM'][S.mode]}}
   io.lcdSet(l1,l2);ledsK.forEach((v,i)=>io.led('k'+(i+1),v?1:0));io.led('pw',Math.sqrt(pwmP/255));
   const H=k=>S.down[k]?'<i>0</i>':'1';
   io.pins(pinRow([['D7',H('K1')],['D6',H('K2')],['D5',H('K3')],['D4',H('K4')],['D3',H('PWR')],['D2',H('PUSH')],['D13–10',ledsK.map(v=>v?1:0).join(''),'o'],['D9 PWM',String(pwmP).padStart(3,'0'),'o'],['A0',String(S.knob).padStart(4,'0')],['State',S.on?['VOL','SCROLL','ZOOM'][S.mode]:'ASLEEP','s']]));
  }};
 const S=simShell(el,o),sb=el.querySelector('.sim-snd');
 sb.addEventListener('click',()=>{fx.set(!fx.on);sb.setAttribute('aria-pressed',fx.on);sb.textContent=fx.on?'🔊 Clicks on':'🔇 Clicks off'});
 el.addEventListener('pointerdown',()=>fx.wake(),{capture:true});
 new MutationObserver((m,obs)=>{if(!el.isConnected){fx.close();obs.disconnect()}}).observe(document.getElementById('app')||document.body,{childList:true});

}
