<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Henry Ortega · Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Questrial&family=VT323&family=Syncopate:wght@700&family=Press+Start+2P&family=Orbitron:wght@700;900&family=Chakra+Petch:wght@600&family=Noto+Sans+JP:wght@700&display=swap">
<style>
/* Layout: Tigre Studio system. Black openers and white content bands alternate; one spectrum bar per page; renders cut on a single corner; italic serif labels on the left column. Deliberately one look, colours set explicitly. */
:root{
  --black:#000000; --white:#ffffff; --muted-d:#8c8c8c; --muted-l:#595959; --alt:#f2f2f2; --grid-d:#333333; --grid-l:#d9d9d9;
  --yellow:#ffb000; --red:#e50000; --blue:#0036f9; --sky:#59c0e6;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --display:"Futura Condensed ExtraBold",Anton,"Arial Narrow",sans-serif;
  color-scheme:dark;
}
html{background:var(--black);scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-size:16px;line-height:1.4}
a{color:inherit}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto}
.dark{background:var(--black);color:var(--white);--muted:var(--muted-d);--rule:var(--white);--grid:var(--grid-d);--focus:var(--sky)}
.light{background:var(--white);color:var(--black);--muted:var(--muted-l);--rule:var(--black);--grid:var(--grid-l);--focus:var(--blue)}
.alt{background:var(--alt);color:var(--black);--muted:var(--muted-l);--rule:var(--black);--grid:var(--grid-l);--focus:var(--blue)}
:focus-visible{outline:2px solid var(--focus,var(--sky));outline-offset:2px}
.spectrum{display:block;height:8px;background:linear-gradient(90deg,var(--sky) 0%,var(--blue) 20%,var(--red) 36.5%,var(--yellow) 50%,var(--red) 63.5%,var(--blue) 80%,var(--sky) 100%)}
.spectrum.thin{height:3px}
.it{font-family:var(--serif);font-style:italic}
.muted{color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--black);border-bottom:1px solid var(--grid-d)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--black)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:20px;flex-wrap:wrap}
.nav li a{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted-d);text-decoration:none}
.nav li a:hover,.nav li a[aria-current="true"]{color:var(--white)}

/* section heading */
.section{padding-block:72px}
.eyebrow{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:0 0 12px}
.sh-title{font-weight:700;font-size:clamp(36px,5vw,64px);line-height:.95;letter-spacing:-.02em;margin:0 0 20px;text-wrap:balance}
.sh-sub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,26px);line-height:1.2;margin:0;padding-bottom:16px;border-bottom:2px solid var(--rule)}
.intro{font-size:clamp(19px,1.8vw,24px);line-height:1.2;max-width:46ch;margin:24px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:20px 0 0;padding:0}
.chips li{border:1px solid var(--grid);padding:5px 10px;font-size:13px}

/* hero */
.hero{padding-block:48px 56px;display:grid;gap:28px}
.name{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(64px,13vw,200px);line-height:.9;margin:0;letter-spacing:.005em}
.hero-grid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:48px}
.hero-grid .who{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.25;margin:0}
.hero-grid .who span{display:block;font-family:var(--sans);font-style:normal;font-size:13px;color:var(--muted);margin-top:10px;text-transform:uppercase;font-weight:700;letter-spacing:.02em}
.role{font-weight:700;font-size:clamp(24px,3vw,40px);line-height:1.02;letter-spacing:-.015em;margin:0}
.lead{font-size:clamp(19px,1.8vw,24px);line-height:1.2;max-width:40ch;margin:14px 0 0}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:16px;padding:7px 22px;border:1px solid var(--white);background:var(--black);color:var(--white);text-decoration:none}
.btn:hover{background:var(--blue)}
.btn.inv{background:var(--white);color:var(--black)}
.btn.inv:hover{background:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:8px}
.stats div{border-top:2px solid var(--rule);padding-top:10px}
.stats b{display:block;font-size:clamp(40px,5vw,72px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--serif);font-style:italic;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px 24px;list-style:none;margin:0;padding:0;font-weight:700;font-size:13px;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr;gap:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding-top:32px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-decoration:none;min-width:0;display:grid;gap:2px}
.tile .media{aspect-ratio:4/5}
.tile small{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:10px}
.tile h3{font-weight:700;font-size:20px;line-height:1.05;margin:0}
.tile:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-top:32px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{text-decoration:none;display:grid;gap:2px;min-width:0}
.card .media{aspect-ratio:16/10}
.card h3{font-weight:700;font-size:22px;line-height:1.05;margin:14px 0 2px}
.card p{margin:0;font-family:var(--serif);font-style:italic;color:var(--muted)}
.card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.media{overflow:hidden;background:#1a1a1a;max-width:100%;position:relative}
.light .media,.alt .media{background:#e6e6e6}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.tr{border-top-right-radius:24px}.bl{border-bottom-left-radius:24px}
.tr-l{border-top-right-radius:64px}.bl-l{border-bottom-left-radius:64px}
@media (max-width:640px){.tr-l{border-top-right-radius:24px}.bl-l{border-bottom-left-radius:24px}}
.path{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:2px solid var(--rule)}
.path li{display:grid;gap:2px;padding:12px 16px 0 0;position:relative}
.path li::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--sky)}
.path li:last-child::before{background:var(--yellow)}
.path span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:8px}
.path b{font-size:17px;line-height:1.15}
.path i{font-family:var(--serif);color:var(--muted)}
@media (max-width:760px){.path{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}}
.skillcard .media{aspect-ratio:16/10}
.skill{position:absolute;inset:0;background:var(--alt);color:var(--black);padding:20px 22px;display:flex;flex-direction:column;gap:8px;background-image:linear-gradient(var(--grid-l) 1px,transparent 1px),linear-gradient(90deg,var(--grid-l) 1px,transparent 1px);background-size:32px 32px}
.skill-k{margin:0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}
.skill-h{margin:0;font-weight:700;font-size:clamp(24px,2.4vw,34px);line-height:.98;letter-spacing:-.015em;text-wrap:balance}
.skill-c{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skill-c li{font-size:12px;border:1px solid var(--black);padding:2px 8px;background:var(--alt);font-family:ui-monospace,Menlo,Consolas,monospace}
.skillcard .learned{font-family:var(--sans);font-style:normal;color:var(--white);font-size:15px;line-height:1.35;margin:4px 0 6px;max-width:46ch}
.sheet{position:absolute;inset:0;background:var(--alt);color:var(--black);padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;background-image:linear-gradient(var(--grid-l) 1px,transparent 1px),linear-gradient(90deg,var(--grid-l) 1px,transparent 1px);background-size:32px 32px}
.sheet-k{margin:0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px;line-height:1.2}
.sheet ol li{display:flex;gap:10px;background:var(--alt);padding:2px 0}
.sheet ol b{font-variant-numeric:tabular-nums;color:var(--muted-l);font-size:12px;min-width:18px}
.sheet-t{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sheet-t li{font-size:11px;border:1px solid var(--black);padding:1px 7px;background:var(--alt)}
.ph{display:grid;place-items:center;height:100%;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;padding:16px;text-align:center}
.ph svg{position:absolute;inset:0;width:100%;height:100%}

/* documentation */
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding-top:32px}
.doc-grid p{margin:0;max-width:52ch;font-size:18px}
.roles{list-style:none;margin:0;padding:0;display:grid;gap:0}
.roles li{border-top:1px solid var(--grid);padding:10px 0;font-weight:700}
@media (max-width:820px){.doc-grid{grid-template-columns:1fr;gap:24px}}
.anat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;list-style:none;margin:24px 0 0;padding:0;border-top:2px solid var(--rule)}
.anat li{padding:14px 12px 14px 0;border-bottom:1px solid var(--grid);display:flex;gap:12px;align-items:baseline}
.anat b{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
@media (max-width:760px){.anat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.caps{display:grid;gap:48px;padding-top:40px}
.cap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
.cap h3{font-weight:700;font-size:28px;line-height:1;margin:0 0 10px}
.cap p{margin:0}
.pages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pages figure{margin:0;min-width:0}
.pages figcaption{font-size:12px;margin-top:6px}
.pages figcaption i{display:block;color:var(--muted)}
.sil{position:relative;aspect-ratio:16/9;background:var(--white);border:1px solid var(--grid);overflow:hidden}
.sil i{position:absolute;display:block}
@media (max-width:900px){.cap{grid-template-columns:1fr;gap:16px}.pages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.timeline{display:grid;gap:40px;padding-top:40px}
.era{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;border-top:2px solid var(--rule);padding-top:16px}
.era h3{font-weight:700;font-size:24px;line-height:1.05;margin:4px 0 8px}
.era p{margin:0;color:var(--muted)}
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.docs li{border:1px solid var(--grid);padding:12px;display:grid;gap:4px;min-width:0}
.docs .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.docs b{font-size:16px;line-height:1.1}
.docs .k{font-family:var(--serif);font-style:italic;font-size:14px}
@media (max-width:760px){.era{grid-template-columns:1fr;gap:12px}}
.fine{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:24px;max-width:70ch}

/* rhino list */
.rh-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-top:32px}
@media (max-width:900px){.rh-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rh-list{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:10px 0 0;padding:0}
.tags li{font-size:12px;border:1px solid var(--grid);padding:2px 8px}

/* resume */
.res-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;padding-top:32px}
.res-top p{margin:0 0 14px;font-size:18px;max-width:52ch}
.contact-list{list-style:none;margin:0;padding:0;display:grid}
.contact-list li{border-top:1px solid var(--grid);padding:12px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.contact-list li span:first-child{font-family:var(--serif);font-style:italic;color:var(--muted)}
.contact-list li span:last-child{font-weight:700;user-select:all;overflow-wrap:anywhere}
@media (max-width:820px){.res-top{grid-template-columns:1fr;gap:24px}}
.caps5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;padding-top:40px}
.caps5 h4{font-weight:700;font-size:18px;line-height:1.1;margin:0 0 6px}
.caps5 p{margin:0;font-size:15px}
.caps5 div{border-top:2px solid var(--rule);padding-top:12px}
@media (max-width:1000px){.caps5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exp{list-style:none;margin:40px 0 0;padding:0;border-top:2px solid var(--rule)}
.exp>li{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:40px;padding:22px 0;border-bottom:1px solid var(--grid)}
.exp .when{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);padding-top:4px}
.exp h4{font-weight:700;font-size:22px;line-height:1.1;margin:0}
.exp .org{font-family:var(--serif);font-style:italic;font-size:18px;margin:2px 0 8px}
.exp ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:80ch}
@media (max-width:760px){.exp>li{grid-template-columns:1fr;gap:6px}}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-top:24px}
.skills h4{font-weight:700;font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.skills h4 b{font-size:12px;color:var(--muted)}
.skills ul{list-style:none;margin:0;padding:0}
.skills li{border-top:1px solid var(--grid);padding:7px 0;display:flex;justify-content:space-between;gap:8px}
.skills li em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--red)}
.dark .skills li em{color:var(--yellow)}
@media (max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.skills{grid-template-columns:1fr}}
.certs{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.certs li{border-top:2px solid var(--rule);padding-top:12px;display:grid;gap:4px}
.certs .d{font-size:13px;color:var(--muted)}
.certs b{font-size:20px;line-height:1.1}
@media (max-width:760px){.certs{grid-template-columns:1fr}}
.sub-h{font-weight:700;font-size:28px;margin:56px 0 0}

/* contact */
.contact{padding-block:88px}
.contact h2{font-weight:700;font-size:clamp(56px,10vw,150px);line-height:.9;letter-spacing:-.03em;margin:0 0 16px}
.copy{background:none;border:1px solid var(--grid-d);color:var(--white);font:inherit;font-size:12px;padding:3px 10px;cursor:pointer;margin-left:10px}

/* project page */
.rh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:center;padding-block:20px;font-weight:700;font-size:13px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.rh .num{justify-self:end}
@media (max-width:640px){.rh{grid-template-columns:1fr auto}.rh .hide-s{display:none}}
.case{padding-block:16px 40px}
.case .num{font-weight:700;font-size:13px;text-transform:uppercase;color:var(--muted);margin:0 0 16px;letter-spacing:.01em}
.case h1{font-weight:700;font-size:clamp(52px,9vw,140px);line-height:.92;letter-spacing:-.03em;margin:0 0 24px;text-wrap:balance}
.case .meta{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.2;margin:0;padding-bottom:16px;border-bottom:2px solid var(--rule)}
.case .note{font-size:clamp(20px,2.2vw,28px);line-height:1.1;max-width:34ch;margin:24px 0 0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:40px 0 0}
.facts div{border-top:1px solid var(--grid);padding-top:10px;min-width:0}
.facts dt{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}
.facts dd{margin:4px 0 0;font-weight:700;font-size:18px;line-height:1.15}
@media (max-width:720px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.heroimg{display:block;width:100%;max-width:100%}
.hero-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:start;padding-bottom:56px}
.hero-split .media img{height:auto}
@media (max-width:900px){.hero-split{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;padding-top:32px}
.cols h3{font-weight:700;font-size:28px;line-height:1;letter-spacing:-.01em;margin:0 0 10px}
.cols p{margin:0;max-width:44ch}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:32px}}
.gallery{columns:3 280px;column-gap:16px;padding-top:32px}
.gallery figure{margin:0 0 16px;break-inside:avoid}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:8px}
.stagger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;align-items:start;padding-top:40px}
.stagger figure{margin:0;min-width:0}
.stagger figure:nth-child(2){margin-top:96px}
.stagger figcaption{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:10px}
.stagger .media{aspect-ratio:4/5}
@media (max-width:900px){.stagger{grid-template-columns:1fr}.stagger figure:nth-child(2){margin-top:0}}
.statement{position:relative;overflow:hidden}
.statement img{display:block;width:100%;height:min(80vh,720px);object-fit:cover;filter:brightness(.5)}
.statement p{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:48px;margin:0 auto;max-width:1440px;font-weight:700;font-size:clamp(34px,6vw,88px);line-height:.92;letter-spacing:-.02em;color:var(--white);text-wrap:balance}
.statement p .it{font-weight:400}
.next{display:block;text-decoration:none;padding-block:64px 72px}
.next .k{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--muted)}
.next .t{display:block;font-weight:700;font-size:clamp(44px,9vw,140px);line-height:.92;letter-spacing:-.03em;margin-top:8px}
.next:hover .t{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:10px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-block:24px 32px;font-size:13px;color:var(--muted-d)}

function keypadPage(){
 const I=KP.img;
 return head('product','New')+`<main>
 <section class="band dark"><div class="wrap case"><p class="num">New · Rhino Workflow / Parametric · November 2026</p><h1>${KP.title}</h1><p class="meta">${KP.meta}</p>
  <p class="note">A four-key macropad whose case texture is generated, not modeled. Move a slider and the whole case re-tiles in Voronoi cells, while the key pockets, knob and USB-C port stay clean.</p>
  <dl class="facts"><div><dt>Software</dt><dd>Rhino 9 · Grasshopper 2</dd></div><div><dt>Model</dt><dd>13 solids on 6 layers, in mm</dd></div><div><dt>Texture</dt><dd>~100–120 Voronoi cells, cut as grooves</dd></div><div><dt>Update</dt><dd>About 15 s per slider change</dd></div></dl></div></section>
 <div class="band dark" style="padding-bottom:56px"><div class="wrap"><div class="media tr-l" style="aspect-ratio:16/9;background:#fff">${im(I.render,'Shaded keypad: grey case tiled in Voronoi cells, four blue keycaps, a mint key and a knurled knob')}</div></div></div>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Brief, Approach, Result</h2><p class="sh-sub">One solid, one definition, any pattern</p>
  <div class="pra">
   <div><small>Brief</small><h3>Texture Without Remodeling</h3><p>A compact macropad: four keys, a mint function key, a knurled knob, USB-C and four feet. The case needed a surface texture that could change late in the design without rebuilding a single part.</p></div>
   <div><small>Approach</small><h3>Generate The Pattern On The Solid</h3><p>A Grasshopper 2 definition lays cells over the top face and side walls, insets each into a tile and cuts the gaps as grooves with one solid boolean. Keep-out zones around the key pockets, knob and USB-C recess are left clear automatically, each with a margin.</p></div>
   <div><small>Result</small><h3>A Texture You Can Dial In</h3><p>Five sliders, including cell count, seed and gap, drive the whole case. A bake toggle writes the result to its own Case_Textured layer, so the original 13 parts are never touched and every version is easy to compare.</p></div>
  </div>
  <div class="duo"><figure>${im(I.edges,'Case with Voronoi grooves, surface edges shown')}<figcaption>Grooves follow the rounded edges and wrap onto the side walls.</figcaption></figure>
  <figure>${im(I.gh,'Grasshopper 2 canvas: five sliders feeding the Voronoi Texture component')}<figcaption>The Grasshopper 2 definition: five sliders into one Voronoi Texture component.</figcaption></figure></div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">The Base Model</h2><p class="sh-sub">Built clean so the texture has something reliable to cut</p>
  <div class="mono"><figure>${im(I.four,'Four-view layout of the untextured keypad: top, perspective, front and right')}<figcaption>Top, perspective, front and right views before texturing. Each part type sits on its own layer: Case, Keycaps_Blue, Keycap_Mint, Knob, Feet, USB_Port.</figcaption></figure></div>
  <div class="duo"><figure>${im(I.top,'Top wireframe of the case outline, keycap pockets, knob and feet')}<figcaption>Top wireframe: the pockets and knob footprint become the texture's keep-out zones.</figcaption></figure>
  <figure>${im(I.front,'Front and right elevations with the USB-C port and feet')}<figcaption>Elevations: the USB-C recess on the front wall stays clear of the pattern.</figcaption></figure></div>
 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">How I Worked</h2><p class="sh-sub">Designer-directed, AI-assisted</p>
  <div class="role-box"><div>
   <p>I made the design calls: which surfaces get texture, which pattern to use, and which features must stay clear. I built it with Claude working inside Rhino 9, which wrote the Grasshopper 2 definition from those choices.</p>
   <p>Then I tuned the sliders, checked the booleans and reviewed each bake against the base model. The definition reports its own failures, so a bad seed or gap shows up as a message, not a broken file.</p>
   <ul class="tags"><li>Grasshopper 2</li><li>Voronoi</li><li>Solid booleans</li><li>Keep-out zones</li><li>Parametric texture</li><li>AI-assisted CAD</li></ul></div>
   <figure>${im(I.ai,'Notes from the Rhino AI panel on baking, previews, speed and failed booleans')}<figcaption style="font-family:var(--serif);font-style:italic;color:var(--muted-d);margin-top:8px">The build notes inside Rhino: bake behavior, speed and how to recover a failed boolean.</figcaption></figure></div>
 </div></section>

 <section class="statement">${im(I.render,'Keypad render')}<p>The same method fits an outsole: a pattern that <span class="it">follows the form, avoids functional zones</span> and changes with a slider instead of a remodel.</p></section>
 ${nextLink('product',CUR[0])}</main>`+foot();
}

  <div><h3>Claude's work</h3><ul><li>Turning each direction into tokens: primitives, Night/Daylight semantic colors, spacing, radius</li><li>Writing the Figma Plugin API scripts that built variables, text styles, effects and components</li><li>Drawing the 46 Telltales icons on a 24px grid</li><li>Building the public Standard Play site</li></ul></div></div>
  <div class="cols"><div><h3>One Architecture</h3><p>Every tape shares the same semantic token names, two color modes, nine text styles and the same component roles, so a layout built with one tape can be re-skinned with another.</p></div><div><h3>Free Fonts Only</h3><p>Every typeface is a Google Font, so anyone can open a file without missing fonts. The type does most of the work of setting each era.</p></div><div><h3>Original Marks</h3><p>The first tape came from a poster I didn't make. I kept its language and replaced every mark with new ones, the same rule I use for car liveries in the Drive Tapes.</p></div></div>
 </div></section>

 </div></section>

  <div class="sp-links"><a class="btn" href="${SP_SITE}" target="_blank" rel="noopener" style="background:var(--black)">Visit Standard Play</a></div>
 </div></section>
 ${nextLink('rhino',nx)}</main>`+foot();

function cookbookPage(){

 return head('product','CB')+`<main>
 <section class="band dark"><div class="wrap case"><p class="num">Personal Project / Cookbook</p><h1>Fold / Bake</h1><p class="meta">A real-scale parchment cookbook · Chapter 1: Colombia</p>
  <p class="note">Every page is a cooking sheet. Lay each ingredient on its true-size outline, fold the page over the food, crimp the edges and bake. The drawing is the measurement.</p>
  <dl class="facts"><div><dt>Role</dt><dd>Concept, writing, illustration, code</dd></div><div><dt>Tools</dt><dd>Python · Illustrator · Rhino</dd></div><div><dt>Output</dt><dd>A3 sheets · SVG, PDF, DXF</dd></div><div><dt>Status</dt><dd>Chapter 1 drafted · kitchen testing next</dd></div></dl></div></section>
 <div class="band dark" style="padding-bottom:56px"><div class="wrap"><div class="media paper tr-l">${im(I.co01,'Pescado al Coco recipe sheet','heroimg')}</div></div></div>

 <section class="band light section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Why A Cookbook</h2><p class="sh-sub">The idea / The reason / The connection</p>
  <div class="cols"><div><h3>The Idea</h3><p>A cookbook you cook on. Each recipe is printed on baking parchment with the ingredients drawn at their real size, so the page shows exactly how much to use and where it goes.</p></div>
  <div><h3>Why It Matters To Me</h3><p>I wanted a book that lets anyone make a quick, real meal in whatever oven they have, from a full-size range to a countertop air fryer. It opens with Colombian home cooking, the dishes I wanted on its first pages.</p></div>
  <div><h3>What It Borrows From Nike</h3><p>For 16 years I wrote the manuals factories built from: exploded views, tolerances and steps a line can repeat. A recipe is the same problem. If the drawing is right, anyone can make it.</p></div></div></div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">How A Page Works</h2><p class="sh-sub">One A3 sheet / Two halves / One fold</p>
  <ol class="anat">${CB.anat.map((t,i)=>`<li><b>${n2(i)}</b>${t}</li>`).join('')}</ol>
  <div class="cb-pair"><figure><div class="media paper tr">${im(I.top,'Top half of the Pollo Sudado sheet: title, ingredients, method and oven guide')}</div><figcaption>The top half: recipe, method and a five-row oven guide. It folds down over the food.</figcaption></figure>
  <figure><div class="media paper bl">${im(I.serving,'One serving of Pescado al Coco drawn at true size')}</div><figcaption>One serving at true size. A tablespoon of coconut milk is drawn as a 10 mm-deep pool of the right area.</figcaption></figure></div>
 </div></section>

 <section class="band alt section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Designed For Any Oven</h2><p class="sh-sub">Full-size / Fan / Toaster / Air fryer / High altitude</p>
  <p class="intro">Most cookbooks assume one oven. This one doesn't. A full-size oven bakes the whole sheet as one pouch. A toaster or air-fryer oven takes half: cut on the center line and each side becomes its own single-serving pouch, with its own crimp edge.</p>
  <ul class="docs" style="margin-top:32px">${CB.ovens.map(([n,k,d])=>`<li><span class="d">${k}</span><b>${n}</b><span class="k">${d}</span></li>`).join('')}</ul>

 </div></section>

 <section class="band dark section"><div class="wrap"><h2 class="sh-title" style="font-size:32px">Built As A System, Not Drawn By Hand</h2><p class="sh-sub">Python / SVG / PDF / DXF</p>

  <div><h3>One Source, Three Outputs</h3><p>One generator builds every page as layered SVG for Illustrator, vector PDF for print and Rhino, and DXF in millimetres. Outlines, details, labels, text and fold lines each sit on their own layer.</p></div>

/* games: fetch the published file and run it in srcdoc, so it works for every viewer */
function mountGame(){
 const f=document.getElementById('gm-frame'); if(!f) return;
 const box=document.getElementById('gm-box'), msg=document.getElementById('gm-msg'), url=f.dataset.game;
 fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(t=>{f.srcdoc=t;f.addEventListener('load',()=>box.classList.add('ready'),{once:true})})
  .catch(()=>{msg.textContent='The game could not load. Refresh the page to try again.'});
}
function gmExit(){const box=document.getElementById('gm-box');if(!box)return;if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}box.classList.remove('gm-max');document.body.classList.remove('gm-lock')}
document.addEventListener('click',e=>{
 if(e.target.closest('#gm-fs')){const box=document.getElementById('gm-box'),f=document.getElementById('gm-frame');if(!box)return;
  const fb=()=>{box.classList.add('gm-max');document.body.classList.add('gm-lock')};
  try{const p=box.requestFullscreen&&box.requestFullscreen();if(p&&p.catch)p.catch(fb);else if(!p)fb()}catch(err){fb()}
  setTimeout(()=>{try{f.focus();f.contentWindow&&f.contentWindow.focus()}catch(err){}},150)}
 else if(e.target.closest('#gm-x')) gmExit();
});
