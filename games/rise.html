<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

}
html,body{background:var(--night)}
body{color:var(--snow);font-family:var(--f-display);font-size:16px;line-height:1.45}
*{box-sizing:border-box}

.wrap{max-width:1120px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{margin:0;font-weight:700;font-size:clamp(32px,7vw,60px);line-height:.9;letter-spacing:.03em;color:var(--bone);text-shadow:4px 4px 0 var(--deep)}

.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s;color:var(--violet)}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.logo span{animation:none}}
.mopts button.off{opacity:.45}
.mopts button .pr{font-family:var(--f-label);font-size:.8em;color:#8ff0ff;letter-spacing:.04em}
.mopts.shop{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}

/* ---------- creator ---------- */
.creator{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.stage{position:relative;width:100%;max-width:max(300px,min(1120px,calc((100svh - 150px) * 16 / 9)));aspect-ratio:16/9;container-type:inline-size;background:var(--deep);overflow:hidden;border:2px solid var(--line);box-shadow:5px 5px 0 var(--deep)}

.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:1.6cqi 2cqi;pointer-events:none;font-family:var(--f-label);font-size:clamp(9px,1.8cqi,14px);letter-spacing:.06em;text-shadow:1px 1px 0 var(--deep)}

.task{position:absolute;left:2cqi;top:calc(1.6cqi + clamp(14px,3.4cqi,28px));font-size:clamp(10px,1.9cqi,15px);color:var(--bone);background:rgba(7,8,20,.6);padding:.4cqi 1.2cqi;pointer-events:none;max-width:60%}
.bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:2cqi;width:min(60%,520px);display:flex;flex-direction:column;gap:.5cqi;align-items:center;pointer-events:none}

.bar{width:100%;height:clamp(6px,1.3cqi,12px);background:var(--deep);border:2px solid var(--bone)}
.bar i{display:block;height:100%;background:var(--violet);width:100%;transition:width .2s steps(6)}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;animation:ban 2.8s steps(14) forwards}
.banner b{display:block;font-size:clamp(20px,6.5cqi,58px);font-weight:700;color:var(--bone);text-shadow:3px 3px 0 var(--deep);line-height:1}
.banner small{display:block;font-family:var(--f-label);font-size:clamp(9px,1.9cqi,15px);letter-spacing:.1em;color:var(--frost);text-shadow:1px 1px 0 var(--deep);margin-top:.8cqi}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}12%,78%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.banner{animation-duration:3.4s;animation-timing-function:linear}}
.dialog{position:absolute;left:2.5cqi;right:2.5cqi;bottom:2.5cqi;display:flex;gap:1.6cqi;align-items:flex-start;background:var(--panel);border:2px solid var(--bone);box-shadow:3px 3px 0 var(--deep);padding:1.4cqi 1.8cqi;cursor:pointer;font-size:clamp(11px,2.35cqi,19px);line-height:1.35}
.dialog canvas{width:clamp(30px,8.5cqi,72px);aspect-ratio:1;image-rendering:pixelated;flex:none;background:var(--panel2);border:2px solid var(--line)}
.dialog div{min-width:0;flex:1}
.dialog b{display:block;font-family:var(--f-label);font-size:.78em;letter-spacing:.08em;color:var(--ember);margin-bottom:.2em}
.dialog p{margin:0;min-height:2.7em}
.dialog .nx{position:absolute;right:1.4cqi;bottom:.8cqi;font-size:.8em;color:var(--bone);animation:nx 1s steps(2) infinite}
@keyframes nx{50%{opacity:0}}
.menu{position:absolute;inset:0;background:rgba(7,8,20,.82);display:flex;align-items:center;justify-content:center;padding:2cqi;overflow:auto}
.mbox{width:min(100%,640px);display:flex;flex-direction:column;gap:1.6cqi;align-items:stretch;text-align:center;margin:auto}
.mbox h2{margin:0;font-size:clamp(16px,4.4cqi,38px);color:var(--bone);text-shadow:3px 3px 0 var(--deep);line-height:1.05;text-wrap:balance}
.mbox p{margin:0;color:var(--frost);font-size:clamp(11px,2.1cqi,16px)}
.mopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1.2cqi}
.mopts button{background:var(--panel);border:2px solid var(--line);padding:1.2cqi 1.4cqi;text-align:left;display:flex;flex-direction:column;gap:.2em;font-size:clamp(11px,2.1cqi,16px)}
.mopts button b{font-weight:600;font-size:1.1em}
.mopts button span{color:var(--frost);line-height:1.25}
.mopts button.sel{border-color:var(--ember)}
.mopts button.sel b{color:var(--ember)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1cqi;font-variant-numeric:tabular-nums}
.stats div{background:var(--panel);border:2px solid var(--line);padding:1cqi}
.stats b{display:block;font-size:clamp(14px,3.4cqi,28px);color:var(--bone)}
.stats span{font-family:var(--f-label);font-size:clamp(8px,1.5cqi,12px);letter-spacing:.06em;color:var(--frost)}

.keys{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-family:var(--f-label);font-size:12px;letter-spacing:.04em;color:var(--frost)}
.keys kbd{font-family:inherit;color:var(--snow);background:var(--panel);border:2px solid var(--line);padding:0 5px}
.pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.pad .cl{display:flex;gap:10px;align-items:center}
.pad .cr{display:grid;grid-template-columns:repeat(2,auto);gap:8px}
.pad button{width:68px;height:62px;background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--deep);font-family:var(--f-label);font-size:12px;letter-spacing:.04em;touch-action:none}
.pad .arrow{font-size:24px;width:66px;height:66px}
.pad button.on{background:var(--panel2);border-color:var(--ember);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--deep)}
.pad .pj{border-color:var(--ember)}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.keys{display:none}}
</style>

<main class="wrap">
  <header>
    <div>
      <h1 class="logo" aria-label="Rise"><span aria-hidden="true">R</span><span aria-hidden="true">I</span><span aria-hidden="true">S</span><span aria-hidden="true">E</span></h1>
      <p class="tag">An avalanche buried you. A skeleton named Bob dug you out. Now he'll train you to climb the mountain and stop the bad dude at the top.</p>
    </div>
    <div class="hbtns">
      <button class="ghost" id="mute" aria-pressed="false">Sound: on</button>
    </div>
  </header>

  <section id="creator" class="creator" aria-label="Create your climber">
    <div class="frame preview">
      <canvas id="pv" width="72" height="48" aria-label="Preview of your climber at Bob's camp"></canvas>
      <p class="pvname" id="pvname">Juno</p>
      <div class="loadout">
        <div><span class="lbl">Gear</span><br><b id="pvitem"></b></div>
        <div><span class="lbl">Hiking power</span><br><b id="pvpower"></b></div>
      </div>
    </div>
    <div class="frame opts" id="opts">
      <fieldset>
        <legend class="lbl">Name</legend>
        <input id="name" maxlength="12" value="Juno" autocomplete="off" spellcheck="false">
      </fieldset>
      <div class="row2" id="looks"></div>
      <fieldset>
        <legend class="lbl">Gear item</legend>
        <div class="cards" id="items"></div>
      </fieldset>
      <fieldset>
        <legend class="lbl">Hiking power</legend>
        <div class="cards" id="powers"></div>
      </fieldset>
      <div class="go">
        <button class="big" id="start">Wake up at camp</button>
        <button class="sec" id="cont" hidden>Continue climb</button>
        <button class="sec" id="rand">Randomize</button>
      </div>
    </div>
  </section>

  <section id="play" class="playwrap" hidden aria-label="Game">
    <div class="stage" id="stage">
      <canvas id="game" width="320" height="180"></canvas>
      <div class="hud"><div class="hudl"><div class="hearts" id="hearts"></div><div class="cocoa" id="cocoa" hidden><svg viewBox="0 0 10 9" aria-hidden="true"><path fill="#f4efe6" d="M1 2h6v6H1z"/><path fill="#7a4a2a" d="M2 3h4v1H2z"/><path fill="#f4efe6" d="M7 3h2v3H7V5h1V4H7z"/><path fill="#c9c2d8" d="M2 0h1v1H2zM4 0h1v1H4z"/></svg><span id="cocoatxt"></span></div></div><div class="hudr"><span class="sh" id="shards">0 shards</span><span id="alt">1,050 m</span></div></div>
      <div class="task" id="task" hidden></div>
      <div class="bossbar" id="bossbar" hidden><b id="bossname"></b><div class="bar"><i id="bosshp"></i></div></div>
      <div class="banner" id="banner" hidden></div>
      <div class="dialog" id="dialog" hidden><canvas id="portrait" width="24" height="24"></canvas><div><b id="dwho"></b><p id="dtext"></p></div><span class="nx">▼</span></div>
      <div class="menu" id="menu" hidden></div>
      <div class="sr" aria-live="polite" id="live"></div>
    </div>
    <div class="pad" id="pad">
      <div class="cl">
        <button class="arrow" data-act="left" aria-label="Move left">◀</button>
        <button class="arrow" data-act="right" aria-label="Move right">▶</button>
      </div>
      <div class="cr">
        <button data-act="attack">AXE</button>
        <button class="pj" data-act="jump">JUMP</button>
        <button data-act="dash" id="pdash" hidden>DASH</button>
        <button data-act="shield" id="pshield" hidden>SHIELD</button>
        <button data-act="cocoa" id="pcocoa" hidden>COCOA</button>
        <button data-act="throw" id="pthrow" hidden>THROW</button>
        <button data-act="down" id="ppound" hidden>POUND</button>
        <button data-act="shop" id="pshop" hidden>SHOP</button>
      </div>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</main>

<script>
(()=>{
'use strict';
const T=16,VW=320,VH=180,R=12,STEP=1000/60;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const sc=new Map();
function shade(hex,a){const k=hex+a;let v=sc.get(k);if(v)return v;const n=parseInt(hex.slice(1),16);const f=x=>Math.round(a<0?x*(1+a):x+(255-x)*a);v=`rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`;sc.set(k,v);return v}
const isTouch=matchMedia('(hover:none) and (pointer:coarse)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SAVE='grimlotch-peak-save-v2';

/* ================= SOUND ================= */
let AC=null,muted=false;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f1,f2,d,type='square',vol=.05,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={jump:()=>tone(330,620,.11),dbl:()=>tone(520,1040,.13,'triangle'),hit:()=>tone(240,90,.08,'square',.06),hurt:()=>tone(320,60,.28,'sawtooth',.05),shard:()=>{tone(880,1320,.07,'triangle',.04);tone(1320,1760,.09,'triangle',.035,.06)},dash:()=>tone(180,820,.14,'sawtooth',.035),shield:()=>tone(700,300,.3,'sine',.06),boss:()=>tone(110,40,.9,'sawtooth',.07),heal:()=>{tone(523,784,.14,'triangle',.05);tone(784,1046,.2,'triangle',.05,.12)},swing:()=>tone(170,90,.06,'triangle',.05),talk:()=>tone(230+Math.random()*80,200,.03,'square',.015),grim:()=>tone(90+Math.random()*30,70,.05,'sawtooth',.02),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.28,'triangle',.06,i*.16)),shatter:()=>tone(1400,300,.14,'square',.025),slam:()=>tone(90,30,.35,'square',.07),reflect:()=>tone(900,1800,.1,'triangle',.05)};
const sfx=k=>{try{SFX[k]&&SFX[k]()}catch(e){}};
$('#mute').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent='Sound: '+(muted?'off':'on');e.currentTarget.setAttribute('aria-pressed',String(muted));audioInit()});

/* ================= SPRITES ================= */
let SC=null,FL=false;
function px(x,y,w,h,c){SC.fillStyle=FL?'#ffffff':c;SC.fillRect(x,y,w,h)}
function sp(c,x,y,face,w){SC=c;c.save();c.translate(Math.round(x),Math.round(y));if(face<0){c.translate(w,0);c.scale(-1,1)}}
function ep(){SC.restore()}

function drawHuman(c,x,y,L,o={}){
  const skel=isBobName(L.name),sk=skel?'#efe4c8':L.skin;
  sp(c,x,y,o.face||1,12);
  if(o.lying){c.translate(0,18);c.rotate(-Math.PI/2)}
  const coatD=shade(L.coat,-.28);
  px(1,8,3,6,'#6b4a2b');px(1,8,3,1,'#8f6740');px(1,11,3,1,'#553a22');
  let lf=0,lb=0;
  if(o.air){lf=1;lb=-1}else if(o.walk!==undefined&&o.walk>=0){const p=[0,1,0,-1][o.walk%4];lf=p;lb=-p}
  px(4+lb,14,2,3,shade(L.pants,-.25));px(6+lf,14,2,3,L.pants);
  px(3+lb,17,3,1,skel?shade(sk,-.15):'#2e2119');px(6+lf,17,3,1,skel?sk:'#3d2c20');
  px(3,8,6,6,L.coat);px(3,13,6,1,coatD);px(8,9,1,4,shade(L.coat,.12));
  if(o.atk){px(7,9,3,2,coatD)}else{px(5,9,2,4,coatD);px(5,13,2,1,sk)}
  if(L.scarf!=='none'){px(3,8,7,2,L.scarf);px(1,9,3,1,L.scarf);px(1,10,2,2,shade(L.scarf,-.2))}
  px(4,2,6,6,sk);px(9,5,1,2,sk);px(4,7,6,1,shade(sk,-.12));

function buildCreator(){
  const looks=$('#looks');looks.innerHTML='';
  for(const [k,label,type] of GROUPS){
    const fs=document.createElement('fieldset');fs.innerHTML=`<legend class="lbl">${label}</legend>`;
    const box=document.createElement('div');box.className=type==='sw'?'sw':'chips';
    for(const v of OPT[k]){
      const b=document.createElement('button');b.type='button';
      if(type==='sw'){if(v==='none'){b.className='none';b.setAttribute('aria-label','No '+label.toLowerCase())}else{b.style.background=v;b.setAttribute('aria-label',label+' '+v)}}
      else b.textContent=v;
      b.setAttribute('aria-pressed',String(look[k]===v));
      b.addEventListener('click',()=>{look[k]=v;sync()});
      box.appendChild(b);
    }

class LB{
  constructor(){this.g=[];this.ents=[];this.deco=[];this.arena=null;this.exit=null}
  get n(){return this.g.length}
  col(h,c=0,top){const a=new Array(R).fill('.');for(let r=R-h;r<R;r++)a[r]='#';if(h>0&&top==='i')a[R-h]='i';for(let r=0;r<c;r++)a[r]='#';this.g.push(a)}
  flat(n,h,c=0,top){const s=this.n;for(let i=0;i<n;i++)this.col(h,c,top);return s}
  gap(n,c=0){return this.flat(n,0,c)}
  raise(x,w,h){for(let i=0;i<w;i++)for(let r=R-h;r<R;r++)this.g[x+i][r]='#'}
  plat(x,row,w,ch='-'){for(let i=0;i<w;i++)this.g[x+i][row]=ch}
  surf(x){let r=R-1;while(r>=0&&this.g[x][r]!=='.')r--;return r+1}
  ceil(x){let r=0;while(r<R&&this.g[x][r]!=='.')r++;return r}
  ent(type,x,o={}){let y;if(o.ceil)y=this.ceil(x)*T;else if(o.row!==undefined)y=(o.row+1)*T;else y=this.surf(x)*T;this.ents.push(Object.assign({type,x:x*T+T/2,y},o))}
  spikes(x,n){for(let i=0;i<n;i++){const s=this.surf(x+i);this.g[x+i][s-1]='^'}}
  pocket(x,loot){const s=this.surf(x);for(let i=0;i<4;i++)for(let r=s-3;r<s;r++)this.g[x+i][r]='#';this.g[x-1][s-1]='#';for(let i=1;i<3;i++)for(let r=s-2;r<s;r++)this.g[x+i][r]='.';this.g[x][s-2]='x';this.g[x][s-1]='x';this.ents.push({type:'chest',x:(x+2)*T,y:s*T,gold:1,loot})}
  dec(type,x){this.deco.push({type,x:x*T+T/2,y:this.surf(x)*T})}
  build(){const grid=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<this.n;c++)row.push(this.g[c][r]);grid.push(row)}return{grid,cols:this.n,ents:this.ents,deco:this.deco,arena:this.arena,exit:this.exit}}
}

const isSolid=ch=>ch==='#'||ch==='i'||ch==='L'||ch==='x';
function tileAt(c,r){if(c<0||c>=Z.cols)return'#';if(r<0||r>=R)return'.';return Z.grid[r][c]}
function colSolid(x,y0,y1){const c=Math.floor(x/T),r0=Math.floor(y0/T),r1=Math.floor(y1/T);for(let r=r0;r<=r1;r++)if(isSolid(tileAt(c,r)))return true;return false}
function rowHas(r,x0,x1,f){const c0=Math.floor(x0/T),c1=Math.floor(x1/T);for(let c=c0;c<=c1;c++)if(f(tileAt(c,r)))return true;return false}
function moveBody(b){
  b.hitL=b.hitR=false;
  b.x+=b.vx;
  if(b.vx>0&&colSolid(b.x+b.w-.01,b.y,b.y+b.h-.01)){b.x=Math.floor((b.x+b.w)/T)*T-b.w;b.vx=0;b.hitR=true}
  else if(b.vx<0&&colSolid(b.x,b.y,b.y+b.h-.01)){b.x=(Math.floor(b.x/T)+1)*T;b.vx=0;b.hitL=true}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;
  if(b.vy>=0){const bot=b.y+b.h,r=Math.floor(bot/T);
    if(rowHas(r,b.x,b.x+b.w-.01,isSolid)||(!(b.dropT>0)&&rowHas(r,b.x,b.x+b.w-.01,c=>c==='-')&&pb<=r*T+.5)){b.y=r*T-b.h;b.vy=0;b.onGround=true}}
  else{const r=Math.floor(b.y/T);if(rowHas(r,b.x,b.x+b.w-.01,isSolid)){b.y=(r+1)*T;b.vy=0}}
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function groundAhead(e){const fx=e.face>0?e.x+e.w+1:e.x-1,fy=e.y+e.h+2;const ch=tileAt(Math.floor(fx/T),Math.floor(fy/T));return isSolid(ch)||ch==='-'}

    for(let c=Math.floor(box.x/T);c<=Math.floor((box.x+box.w)/T);c++)for(let r=Math.floor(box.y/T);r<=Math.floor((box.y+box.h)/T);r++)breakTile(c,r);

          if(e.mode==='dive'){e.y+=2.8;e.x+=Math.sign(dx)*.5;if(e.y>=P.y+4||colSolid(e.x+6,e.y+e.h+2,e.y+e.h+2))e.mode='up'}

          break}

}

function updProjs(){

    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;

function updItems(){

      if(it.vx){it.x+=it.vx;if(isSolid(tileAt(Math.floor(it.x/T),Math.floor(it.y/T)))){it.x-=it.vx;it.vx=-it.vx*.4}it.vx*=.97}

    const hb={x:it.x-5,y:it.y-5,w:10,h:10};if(ov(P,hb)){it.taken=true;if(it.type==='shard'){G.shards++;sfx('shard');burst(it.x,it.y,8,'#8ff0ff',1.3)}else{P.hp=Math.min(maxHp(),P.hp+1);sfx('heal');burst(it.x,it.y,10,'#ff6a7a',1.3)}updHUD()}}

    else{px(x-4,y-3,3,2,'#e8455a');px(x+1,y-3,3,2,'#e8455a');px(x-5,y-2,10,3,'#e8455a');px(x-4,y+1,8,1,'#e8455a');px(x-3,y+2,6,1,'#e8455a');px(x-2,y+3,4,1,'#e8455a');px(x-1,y+4,2,1,'#e8455a');px(x-3,y-2,1,1,'#ffb3bd')}}
  if(G.bob){const b=G.bob;const bx=b.x+(b.shake?(tick%4<2?-1:1):0);if(b.pile)drawBobPile(ctx,bx,b.y);else drawBob(ctx,bx,b.y-18+(Math.sin(tick*.06)>.85?-1:0),{face:b.face,wave:!b.shake&&(D.active&&D.who==='bob'||(G.zone===0&&!G.trained&&P.lying)),t:tick})}
  if(G.near&&G.bob){const bx=Math.round(G.bob.x+6),by=G.bob.y-34+(tick%40<20?0:-1);SC=ctx;px(bx-5,by,11,10,'#eaf0fa');px(bx-1,by+10,2,2,'#eaf0fa');px(bx-1,by+2,3,6,'#3fb7d9');px(bx-2,by+3,5,4,'#7ff0ff');px(bx,by+3,1,2,'#ffffff')}
  for(const e of enemies){if(e.dead)continue;FL=e.flash>0&&e.flash%4<2;
    if(e.boss){if(e.dying&&e.dying%6<3)FL=true;
      if(e.kind==='grim'){glow(ctx,e.x+e.w/2,e.y+e.h/2,30,'rgba(150,90,255,A)',.25)}
      if(e.kind==='golem'){glow(ctx,e.x+e.w/2,e.y+e.h/2,26,'rgba(127,240,255,A)',.2)}
      ({yeti:drawYeti,wyrm:drawWyrm,golem:drawGolem,eagle:drawEagle,grim:drawGrim})[e.kind](ctx,e,e.t);}
    else if(EDRAW[e.type])EDRAW[e.type](ctx,e,e.t);
    else if(e.type==='icicle'){const ox=e.mode==='shake'?(tick%4<2?-1:1):0;drawIcicle(ctx,{x:e.x+ox,y:e.y})}
    FL=false}
  for(const p of parts){if(p.col==='ghost'){ctx.globalAlpha=p.life/30;drawHuman(ctx,p.x-6,p.y-11,G.look,{face:p.face,walk:0});ctx.globalAlpha=1;continue}ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size)}
  // player
  const p=P;
  if(!(p.inv>0&&tick%6<3)||G.dying){
    const L=G.look;
    drawHuman(ctx,p.x-2,p.y-4,L,{face:p.face,lying:p.lying,walk:p.onGround&&Math.abs(p.vx)>.2?Math.floor(p.walkT/6):-1,air:!p.onGround&&!p.lying,atk:p.atkT>0,hurt:p.inv>50||G.dying,blink:tick%180<6});
    if(p.glide){const gx=Math.round(p.x+4),gy2=Math.round(p.y-10),col=L.scarf!=='none'?L.scarf:L.coat;SC=ctx;px(gx-9,gy2,18,2,col);px(gx-7,gy2-1,14,1,col);px(gx-9,gy2+2,2,1,shade(col,-.25));px(gx+7,gy2+2,2,1,shade(col,-.25));ctx.fillStyle='#d9d3c0';ctx.fillRect(gx-8,gy2+3,1,8);ctx.fillRect(gx+7,gy2+3,1,8)}
    if(p.atkT>0){const prog=1-p.atkT/14,ang=-2.1+prog*3.0;const hx=p.x+4+p.face*3,hy=p.y+6;ctx.save();ctx.translate(Math.round(hx),Math.round(hy));ctx.scale(p.face,1);
      if(p.atkT>2&&p.atkT<12){ctx.strokeStyle='rgba(234,240,250,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,12,-1.6,Math.min(.9,ang+.2));ctx.stroke()}
      ctx.rotate(ang);ctx.fillStyle='#8f6740';ctx.fillRect(0,-1,11,2);ctx.fillStyle=L.item==='axe'?'#eef4ff':'#a3acc0';ctx.fillRect(9,-4,2,8);ctx.fillRect(11,-4,3,2);ctx.fillRect(8,3,1,2);ctx.restore()}
    if(p.shieldT>0){const a=p.shieldT<25&&tick%4<2?.25:.6;ctx.strokeStyle=`rgba(175,230,255,${a})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(Math.round(p.x+4)+.5,Math.round(p.y+6)+.5,12,0,7);ctx.stroke();ctx.fillStyle=`rgba(175,230,255,${a*.25})`;ctx.fill()}
  }
  for(const q of projs){const x=Math.round(q.x),y=Math.round(q.y);
    if(q.kind==='snow'){ctx.fillStyle='#ffffff';ctx.fillRect(x-2,y-3,5,7);ctx.fillRect(x-3,y-2,7,5);ctx.fillStyle='#c2cdea';ctx.fillRect(x,y+1,2,2)}
    else if(q.kind==='orb'){const col=q.owner==='p'?'rgba(127,240,255,A)':'rgba(170,100,255,A)';glow(ctx,x,y,10,col,.6);ctx.fillStyle=q.owner==='p'?'#bff8ff':'#2a1046';ctx.fillRect(x-2,y-3,5,7);ctx.fillRect(x-3,y-2,7,5);ctx.fillStyle=q.owner==='p'?'#ffffff':'#d59bff';ctx.fillRect(x-1,y-1,2,2)}
    else if(q.kind==='drop'){drawIcicle(ctx,{x:x-4+(q.delay>0&&tick%4<2?1:0),y:y-4})}
    else if(q.kind==='psnow'){ctx.fillStyle='#ffffff';ctx.fillRect(x-2,y-2,4,4);ctx.fillRect(x-1,y-3,2,6);ctx.fillRect(x-3,y-1,6,2);ctx.fillStyle='#c2cdea';ctx.fillRect(x,y,2,1)}
    else if(q.kind==='feather'){ctx.fillStyle='#e6d2b0';ctx.fillRect(x,y-4,1,8);ctx.fillRect(x-1,y-3,1,5);ctx.fillRect(x+1,y-2,1,4);ctx.fillStyle='#6b4a32';ctx.fillRect(x,y+3,1,2)}
    else if(q.kind==='ice'){ctx.fillStyle='#bfeaf2';ctx.fillRect(x-1,y-3,3,6);ctx.fillRect(x-2,y-1,5,2);ctx.fillStyle='#ffffff';ctx.fillRect(x,y-2,1,2)}
    else if(q.kind==='wave'){ctx.fillStyle='#9fe6ff';ctx.fillRect(x-1,y-6,3,6);ctx.fillRect(x-3,y-3,7,3);ctx.fillStyle='#ffffff';ctx.fillRect(x,y-5,1,3)}}
  ctx.restore();
  // darkness
  if(BG.th.cave){
    dctx.globalCompositeOperation='source-over';dctx.fillStyle='rgba(3,5,16,.93)';dctx.fillRect(0,0,VW,VH);dctx.globalCompositeOperation='destination-out';
    const lt=(x,y,r)=>{x-=cam.x;y-=cam.y;if(x<-r||x>VW+r)return;const g=dctx.createRadialGradient(x,y,r*.25,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');dctx.fillStyle=g;dctx.fillRect(x-r,y-r,r*2,r*2)};
    lt(P.x+4,P.y+6,G.look.item==='lantern'?120:58+Math.sin(tick*.1)*2);
    for(const d of Z.deco)if(d.type==='crystal')lt(d.x,d.y-6,34);
    for(const c of checks)if(c.lit)lt(c.x,c.y-6,52);
    for(const ch of chests)if(ch.gold&&!ch.open)lt(ch.x,ch.y-6,22);
    for(const q of projs)lt(q.x,q.y,18);
    for(const e of enemies)if(e.boss&&!e.dead)lt(e.x+e.w/2,e.y+e.h/2,46);else if(e.type==='bat'&&!e.dead)lt(e.x+5,e.y+3,10);
    if(G.bob)lt(G.bob.x+6,G.bob.y-8,24);
    ctx.drawImage(dark,0,0);
  }
  // snow
  if(BG.th.snow){const n=Math.min(flakes.length,BG.th.snow);ctx.fillStyle='rgba(240,245,255,.85)';for(let i=0;i<n;i++){const f=flakes[i];ctx.fillRect(Math.round(f.x),Math.round(f.y),f.s,f.s)}}
  if(flashT>0){ctx.fillStyle=`rgba(230,215,255,${flashT/20})`;ctx.fillRect(0,0,VW,VH)}
  let fa=0;if(G.fade)fa=G.fade.t/24;
  if(G.fadeIn){G.fadeA=(G.fadeA===undefined?1:G.fadeA)-.012;if(G.fadeA<=0){G.fadeIn=false}else fa=Math.max(fa,G.fadeA)}
  if(G.dying&&G.dying<20)fa=Math.max(fa,1-G.dying/20);
  if(fa>0){ctx.fillStyle=`rgba(7,8,20,${clamp(fa,0,1)})`;ctx.fillRect(0,0,VW,VH)}
}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(100,now-last);last=now;
  if(mode==='creator'){if(tick%2===0)drawPreview();tick++;return}
  if(!G)return;
  acc+=dt;
  while(acc>=STEP){step();acc-=STEP;for(const k in input.pressed)input.pressed[k]=false;if(!G)break}
  if(G)render();
}
$('#start').addEventListener('click',()=>{audioInit();if(!look.name)look.name='Climber';store.del(SAVE);newGame(null)});
$('#cont').addEventListener('click',()=>{audioInit();const s=store.get(SAVE);if(s)newGame(s)});
buildCreator();checkSave();
requestAnimationFrame(frame);
})();
