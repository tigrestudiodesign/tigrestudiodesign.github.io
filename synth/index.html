const DRP=['KIT',[['tune','Tune',-.5,.5],['decay','Decay',.3,1.6],['drv','Drive',0,1],['rev','Reverb',0,1]]];
const FMP=['FM',[['fmR','Ratio',.5,14],['fmI','Index',.1,10],['fmD','Mod dec',.05,3,'s'],['r','Release',.02,4,'s']]];
let page=0;const KC=['b','g','w','o'];
function fmt(v,u){return u==='s'?(v<1?Math.round(v*1000)+'ms':v.toFixed(2)+'s'):u==='c'?Math.round(v)+'c':u==='i'?Math.round(v):Math.round(v*100)}
function curPage(){return P.eng==='drm'&&page===0?DRP:P.eng==='fm'&&page===0?FMP:PAGES[page]}
function renderEnc(){const [nm,ps]=curPage();$('pg').textContent='PAGE '+(page+1)+'/4 · '+nm;
 $('enc').innerHTML=ps.map(([k,l,lo,hi,u],i)=>{const v=(P[k]-lo)/(hi-lo);return `<div class="kn" data-k="${k}" data-i="${i}"><div class="knob ${KC[i]}${KC[i]==='w'?' white':''}"><i style="transform:rotate(${-135+clamp(v,0,1)*270}deg)"></i></div><label>${l}</label><span>${fmt(P[k],u)}</span></div>`}).join('');
 $('enc').querySelectorAll('.kn').forEach(el=>drag(el,(dy)=>{const [k,l,lo,hi,u]=curPage()[1][+el.dataset.i];P[k]=clamp(P[k]+dy*(hi-lo)/220,lo,hi);if(u==='i')P[k]=Math.round(P[k]);
  el.querySelector('i').style.transform=`rotate(${-135+((P[k]-lo)/(hi-lo))*270}deg)`;el.querySelector('span').textContent=fmt(P[k],u);applyFX();drawGraph()}))}
function drag(el,cb){let y=null;el.addEventListener('pointerdown',e=>{y=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(y===null)return;cb(y-e.clientY);y=e.clientY});const up=()=>y=null;el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function slider(host,label,get,set,lo,hi,show){const el=document.createElement('div');el.className='sl';el.innerHTML=`<b>${label}</b><div class="tr"><div class="th"></div></div><em></em>`;host.appendChild(el);
 const tr=el.querySelector('.tr'),em=el.querySelector('em'),upd=()=>{const v=(get()-lo)/(hi-lo);el.style.setProperty('--v',clamp(v,0,1)*100+'%');em.textContent=show(get())};upd();
 const go=e=>{const r=tr.getBoundingClientRect();set(lo+clamp((e.clientX-r.left)/r.width,0,1)*(hi-lo));upd()};let on=false;
 el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);go(e)});el.addEventListener('pointermove',e=>on&&go(e));el.addEventListener('pointerup',()=>on=false);return upd}
let sndUpd=[];
function renderSnd(){const h=$('p-snd');h.innerHTML='';sndUpd=[];
 const tb=document.createElement('div');tb.className='tabs';tb.innerHTML=['OSC','FILTER','ENV','FX'].map((n,i)=>`<button class="btn${i===page?' on':''}" data-p="${i}">${n}</button>`).join('');h.appendChild(tb);
 tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.p;renderSnd();renderEnc()});
 sndUpd.push(slider(h,'Octave',()=>P.oct,v=>P.oct=Math.round(v),-2,2,v=>(v>0?'+':'')+Math.round(v)));
 sndUpd.push(slider(h,'Glide',()=>P.glide,v=>P.glide=v,0,.4,v=>Math.round(v*1000)+'ms'));
 sndUpd.push(slider(h,'LFO rate',()=>P.lfo,v=>P.lfo=v,.05,12,v=>v.toFixed(1)+'Hz'));
 sndUpd.push(slider(h,'Vibrato',()=>P.vib,v=>P.vib=v,0,1,v=>Math.round(v*100)))}
function renderFx(){const h=$('p-fx');h.innerHTML='';
 slider(h,'Drive',()=>P.drv,v=>{P.drv=v;applyFX()},0,1,v=>Math.round(v*100));slider(h,'Chorus',()=>P.cho,v=>{P.cho=v;applyFX()},0,1,v=>Math.round(v*100));
 slider(h,'Delay',()=>P.dly,v=>{P.dly=v;applyFX()},0,1,v=>Math.round(v*100));slider(h,'Reverb',()=>P.rev,v=>{P.rev=v;applyFX()},0,1,v=>Math.round(v*100));
 slider(h,'Volume',()=>M.out?M.out.gain.value:.8,v=>{if(M.out)M.out.gain.value=v},0,1.2,v=>Math.round(v*100))}
/* Grasshopper-style signal graph on the OLED */
function drawGraph(){const nodes=P.eng==='drm'?['KIT','DRUM','DRV','REV']:P.eng==='fm'?['MOD','CAR','AMP','FX']:P.eng==='org'?['BARS','MIX','AMP','FX']:['OSC','FLT','AMP','FX'];
 const W2=P.eng==='acid'?'303':P.w1.slice(0,3).toUpperCase()+'+'+P.w2.slice(0,3).toUpperCase();
 const vals=P.eng==='drm'?[P.kit.toUpperCase(),'8 VOX',Math.round(P.drv*100),Math.round(P.rev*100)]:P.eng==='fm'?['×'+(+P.fmR).toFixed(1),'IDX '+(+P.fmI).toFixed(1),'R '+fmt(P.r,'s'),'R'+Math.round(P.rev*100)]:P.eng==='org'?[(P.bars||[]).join(''),'DRAWBAR','R '+fmt(P.r,'s'),'C'+Math.round(P.cho*100)]:[W2,Math.round(P.cut*100)+'/'+Math.round(P.res*100),fmt(P.a,'s'),'D'+Math.round(P.dly*100)];
 let s='';const w=78,gap=(400-4*w)/3;
 nodes.forEach((n,i)=>{const x=i*(w+gap);if(i<3)s+=`<path d="M${x+w} 22 C ${x+w+gap/2} 22 ${x+w+gap/2} 22 ${x+w+gap} 22" stroke="#FF5A1F" stroke-width="1.6" fill="none"/>`;
  s+=`<rect x="${x}" y="8" width="${w}" height="28" rx="5" fill="#2A2B2E" stroke="#6d7074"/><rect x="${x}" y="8" width="18" height="28" rx="5" fill="#45474b"/><circle cx="${x}" cy="22" r="3" fill="#B9BBBE"/><circle cx="${x+w}" cy="22" r="3" fill="#B9BBBE"/>
  <text x="${x+9}" y="26" font-size="8" fill="#EDEBE6" text-anchor="middle" font-family="JBM" transform="rotate(-90 ${x+9} 22)">${n}</text><text x="${x+48}" y="26" font-size="9" fill="#EDEBE6" text-anchor="middle" font-family="JBM" font-weight="700">${vals[i]}</text>`});
 $('gh').innerHTML=s}
function loadPatch(n){n=((n%N)+N)%N;const vol=M.out?M.out.gain.value:.8;Object.values(voices).forEach(v=>v&&release(v,AC?AC.currentTime:0));voices={};heldMono=[];
 P=patch(n);$('pn').textContent=String(n).padStart(4,'0');$('pname').textContent=P.name;$('tags').innerHTML=`<span><b>${P.dec}</b></span><span>${P.cat}</span><span>${P.eng.toUpperCase()}</span><span>${P.mono?'MONO':'POLY'}</span>`;
 $('eng').textContent=({va:'VIRTUAL ANALOG',fm:'2-OP FM',acid:'ACID 303-STYLE',str:'ENSEMBLE',pluck:'PLUCK',org:'DRAWBAR ORGAN',drm:'DRUM MACHINE'})[P.eng];
 applyFX();renderEnc();renderSnd();renderFx();drawGraph();dialUpd&&dialUpd();try{localStorage.setItem('sy5k',n)}catch(e){}
 $('kb').classList.toggle('drum',P.eng==='drm');buildKeys()}
/* browse */
let DEC='all',CAT='All';const CATS=['All',...new Set(A.map(a=>a[1]))];
function list(){const out=[];for(let i=0;i<A.length;i++){const [d,c]=A[i];if((DEC==='all'||d===DEC)&&(CAT==='All'||c===CAT))for(let v=0;v<100;v++)out.push(i*100+v)}return out}
function stepPatch(d){const L=list();let i=L.indexOf(P.n);if(i<0)i=0;loadPatch(L[((i+d)%L.length+L.length)%L.length])}
let dialUpd;
function renderBrowse(){$('cats').innerHTML=CATS.map(c=>`<button class="chip${c===CAT?' on':''}">${c}</button>`).join('');
 $('cats').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{CAT=b.textContent;renderBrowse();const L=list();if(L.length&&!L.includes(P.n))loadPatch(L[0])})}
/* keys */
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function buildKeys(){const kb=$('kb');kb.innerHTML='';const wn=[0,2,4,5,7,9,11],W=14,ww=100/W;
 if(P.eng==='drm'){for(let i=0;i<8;i++){const k=document.createElement('div');k.className='kw';k.style.left=(i%4)*25+.6+'%';k.style.width=25-1.2+'%';k.style.top=(i<4?0:52)+'%';k.style.bottom=(i<4?52:0)+'%';k.dataset.m=i;k.innerHTML=`<span style="color:#2a2b2e;font-weight:700">${DN[i]}</span>`;kb.appendChild(k)}return}
 for(let i=0;i<W;i++){const o=Math.floor(i/7),n=wn[i%7],m=(oct+1)*12+o*12+n;const k=document.createElement('div');k.className='kw';k.style.left=i*ww+.45+'%';k.style.width=ww-.9+'%';k.dataset.m=m;k.innerHTML=n===0?`<span>C${oct+o}</span>`:'';kb.appendChild(k);
  if([0,2,5,7,9].includes(n%12)&&n!==11){const b=document.createElement('div');b.className='kbk';b.style.left=(i+1)*ww-ww*.32+'%';b.style.width=ww*.64+'%';b.dataset.m=m+1;kb.appendChild(b)}}}
const touch={};
function keyAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-m]')}
function kDown(id,el){if(!el)return;const m=+el.dataset.m;touch[id]={el,m};el.classList.add('dn');noteOn(m,1)}
function kUp(id){const t=touch[id];if(!t)return;t.el.classList.remove('dn');if(P.eng!=='drm')noteOff(t.m);delete touch[id]}
$('kb').addEventListener('pointerdown',e=>{e.preventDefault();$('kb').setPointerCapture(e.pointerId);kDown(e.pointerId,keyAt(e.clientX,e.clientY))});
$('kb').addEventListener('pointermove',e=>{const t=touch[e.pointerId];if(!t||P.eng==='drm')return;const el=keyAt(e.clientX,e.clientY);if(el&&el!==t.el){kUp(e.pointerId);kDown(e.pointerId,el)}});
['pointerup','pointercancel'].forEach(ev=>$('kb').addEventListener(ev,e=>kUp(e.pointerId)));
$('oup').onclick=()=>{oct=Math.min(6,oct+1);buildKeys()};$('odn').onclick=()=>{oct=Math.max(1,oct-1);buildKeys()};
/* computer keyboard (for desktop demos) */
const KM='awsedftgyhujkolp';document.addEventListener('keydown',e=>{if(e.repeat)return;const i=KM.indexOf(e.key);if(i>=0)noteOn((oct+1)*12+i)});document.addEventListener('keyup',e=>{const i=KM.indexOf(e.key);if(i>=0)noteOff((oct+1)*12+i)});
/* loops UI */
function renderLoops(){$('lps').innerHTML=LOOPS.map((l,i)=>`<button class="chip${i===LP?' on':''}" data-i="${i}">${l.n}</button>`).join('');
 $('lps').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{LP=+b.dataset.i;BPM=LOOPS[LP].bpm;$('bpm').textContent=BPM+' BPM';applyFX();renderLoops()});
 $('steps').innerHTML=Array.from({length:16},(_,i)=>`<div class="st${LOOPS[LP].d[0]&&LOOPS[LP].d[0][i]==='x'?' on':''}" id="st${i}"></div>`).join('');
 $('pads').innerHTML=DN.map((n,i)=>`<button class="pad" data-k="${i}" id="pad${i}">${n}</button>`).join('');
 $('pads').querySelectorAll('.pad').forEach(b=>b.onpointerdown=()=>{if(!AC)return;const s=P;P=Object.assign({},patch(0),{eng:'drm',kit:LOOPS[LP].kit});drumHit(+b.dataset.k,AC.currentTime);P=s})}
function showStep(s){document.querySelectorAll('.st.now').forEach(e=>e.classList.remove('now'));if(s>=0){const e=$('st'+s);e&&e.classList.add('now')}}
function padFlash(k){const p=$('pad'+k);if(p){p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),90)}}
$('play').onclick=play;$('stop').onclick=stop;$('bup').onclick=()=>{BPM=Math.min(200,BPM+2);$('bpm').textContent=BPM+' BPM';applyFX()};$('bdn').onclick=()=>{BPM=Math.max(60,BPM-2);$('bpm').textContent=BPM+' BPM';applyFX()};
/* tabs */
document.querySelectorAll('#tabs .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs .btn').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t))});
document.querySelectorAll('#decs .btn').forEach(b=>b.onclick=()=>{DEC=b.dataset.d;document.querySelectorAll('#decs .btn').forEach(x=>x.classList.toggle('on',x===b));const L=list();if(L.length)loadPatch(L[0])});
$('pv').onclick=()=>stepPatch(-1);$('nx').onclick=()=>stepPatch(1);$('pv10').onclick=()=>stepPatch(-100);$('nx10').onclick=()=>stepPatch(100);
$('rnd').onclick=()=>{const L=list();loadPatch(L[Math.floor(Math.random()*L.length)])};
/* oscilloscope */
const cv=$('osc'),cx=cv.getContext('2d');let buf;
function scope(){requestAnimationFrame(scope);const r=cv.getBoundingClientRect(),dp=devicePixelRatio||2;if(cv.width!==r.width*dp){cv.width=r.width*dp;cv.height=r.height*dp}
 cx.clearRect(0,0,cv.width,cv.height);if(!anl)return;buf=buf||new Float32Array(anl.fftSize);anl.getFloatTimeDomainData(buf);let pk=0;for(const x of buf)pk=Math.max(pk,Math.abs(x));if(pk<.002)return;
 cx.strokeStyle='rgba(255,90,31,.95)';cx.lineWidth=1.6*dp;cx.beginPath();let z=0;for(let i=1;i<buf.length/2;i++)if(buf[i-1]<0&&buf[i]>=0){z=i;break}
 const n=buf.length/2;for(let i=0;i<n;i++){const x=i/n*cv.width,y=cv.height*(.78-buf[z+i]*.35);i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
/* power on */
$('go').onclick=async()=>{try{$('unlock').play().catch(()=>{})}catch(e){}initAudio();if(AC.state!=='running')await AC.resume();$('start').style.display='none';AC.onstatechange=()=>{if(AC.state==='interrupted'||AC.state==='suspended')allOff()};scope()};
const wake=()=>{if(!AC)return;if(AC.state!=='running'){AC.resume().catch(()=>{});try{$('unlock').play().catch(()=>{})}catch(e){}}};
['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,wake,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){allOff()}else wake()});
window.addEventListener('pagehide',allOff);window.addEventListener('blur',()=>{for(const k in touch)kUp(+k)});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.mid,.cats'))e.preventDefault()},{passive:false});
/* boot */
renderBrowse();renderLoops();dialUpd=slider($('dial'),'Patch',()=>P.n,v=>{const n=Math.round(v);if(n!==P.n)loadPatch(n)},0,N-1,v=>String(Math.round(v)).padStart(4,'0'));
let start=0;try{start=+localStorage.getItem('sy5k')||0}catch(e){}loadPatch(start);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
